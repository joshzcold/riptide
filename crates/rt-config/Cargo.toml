[package]
name = "rt-config"
description = "Configuration: platform paths, command line, TOML and Lua config files"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rt-core.workspace = true
mlua.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# Named pipes for the remote command, open to their own user only.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }
