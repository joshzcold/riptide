<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messages</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbf9; --fg: #1d1f21; --muted: #5f6368; --line: #e2e2dc; --error: #c62828; --warning: #a15c00;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --fg: #e6e6e3; --muted: #9a9ea6; --line: #2c2e32; --error: #ff7b72; --warning: #e3b341; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  header { border-bottom: 1px solid var(--line); padding: 1rem 1.5rem; }
  header h1 { font-size: 1.3rem; margin: 0; }
  main { max-width: 60rem; padding: .5rem 1.5rem 3rem; }
  .entry { display: grid; grid-template-columns: 5.5rem 4.5rem 1fr; gap: .75rem; padding: .15rem 0; }
  .time, .level { color: var(--muted); font: .85em var(--mono); padding-top: .15rem; }
  .error .level, .error .text { color: var(--error); }
  .warning .level { color: var(--warning); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  #empty { color: var(--muted); margin-top: 2rem; }
</style>
</head>
<body>
<header><h1>Messages</h1></header>
<main id="list"></main>
<script>
const DATA = /*HB_DATA*/null;
const list = document.getElementById("list");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const entries = (DATA || []).slice().reverse();
if (!entries.length) {
  const p = el("p", null, "No messages yet.");
  p.id = "empty";
  list.append(p);
}
for (const m of entries) {
  const row = el("div", `entry ${m.level}`);
  const when = new Date(m.time * 1000);
  row.append(
    el("span", "time", when.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" })),
    el("span", "level", m.level),
    el("span", "text", m.text),
  );
  list.append(row);
}
</script>
</body>
</html>
