<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hackers-browser changelog</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbf9; --fg: #1d1f21; --muted: #5f6368; --line: #e2e2dc;
    --accent: #2f6fdb; --panel: #f1f1ec;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --fg: #e6e6e3; --muted: #9a9ea6; --line: #2c2e32; --accent: #7aa7ff; --panel: #1f2023; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
  main { max-width: 52rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  h1 { font-size: 1.8rem; margin: 0 0 .25rem; }
  h1 + p { color: var(--muted); margin-top: 0; }
  h2 { font-size: 1.3rem; margin: 2.25rem 0 .5rem; padding-bottom: .3rem; border-bottom: 1px solid var(--line); }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 1.25rem 0 .4rem; }
  ul { margin: 0; padding-left: 1.2rem; }
  li { margin: .15rem 0; }
  code { font: .9em var(--mono); background: var(--panel); padding: .05rem .3rem; border-radius: 3px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<!--HB_BODY-->
</main>
</body>
</html>
