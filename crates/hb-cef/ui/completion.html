<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #333333;
    --fg: #ffffff;
    --header-bg: #000000;
    --desc-fg: #c0c0c0;
    --selected-bg: #e8c000;
    --selected-fg: #000000;
    --row-height: 18px;
    --font: 10pt "DejaVu Sans Mono", "Monospace", monospace;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: var(--font);
    user-select: none;
    cursor: default;
  }
  .header, .row {
    display: flex;
    height: var(--row-height);
    line-height: var(--row-height);
    padding: 0 4px;
    white-space: pre;
  }
  .header { background: var(--header-bg); font-weight: bold; }
  .row.selected { background: var(--selected-bg); color: var(--selected-fg); }
  .row.selected .desc { color: var(--selected-fg); }
  .name { width: 50%; max-width: 70ch; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; padding-right: 2ch; box-sizing: border-box; }
  .desc { color: var(--desc-fg); overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="list"></div>
<script>
  // Rows are either {header} or {name, description, selected}.
  window.hbRender = (rows) => {
    const list = document.getElementById("list");
    list.replaceChildren(...rows.map((row) => {
      const el = document.createElement("div");
      if (row.header) {
        el.className = "header";
        el.textContent = row.header;
        return el;
      }
      el.className = row.selected ? "row selected" : "row";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = row.name;
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = row.description;
      el.append(name, desc);
      return el;
    }));
  };
</script>
</body>
</html>
