<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #333333;
    --fg: #ffffff;
    --header-bg: #000000;
    --desc-fg: #c0c0c0;
    --row-height: 18px;
    --font: 10pt "DejaVu Sans Mono", "Monospace", monospace;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: var(--font);
    user-select: none;
    cursor: default;
  }
  .header, .row {
    display: flex;
    height: var(--row-height);
    line-height: var(--row-height);
    padding: 0 4px;
    white-space: pre;
  }
  .header { background: var(--header-bg); font-weight: bold; }
  .name { width: 34ch; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
  .desc { color: var(--desc-fg); overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="list"></div>
<script>
  window.hbRender = (items) => {
    const list = document.getElementById("list");
    const header = document.createElement("div");
    header.className = "header";
    header.textContent = items.length ? items[0].category : "";
    const rows = items.map(({ name, description }) => {
      const row = document.createElement("div");
      row.className = "row";
      const n = document.createElement("span");
      n.className = "name";
      n.textContent = name;
      const d = document.createElement("span");
      d.className = "desc";
      d.textContent = description;
      row.append(n, d);
      return row;
    });
    list.replaceChildren(header, ...rows);
  };
</script>
</body>
</html>
