[package]
name = "riptide"
description = "Riptide: surf the web really fast, with vim-like keys, on CEF"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "riptide"
path = "src/main.rs"

[features]
sandbox = ["rt-cef/sandbox"]
test-control = ["rt-cef/test-control"]

[dependencies]
rt-cef.workspace = true
tracing-subscriber.workspace = true

# Builds run on the platform they're for, so the host is Windows here.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
rt-config.workspace = true
serde_json.workspace = true

[lints]
workspace = true
