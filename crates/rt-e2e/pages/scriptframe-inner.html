<script>
  // Scriptlets for localhost run before this, as in scriptlets.html.
  window.rtFrameAdsEnabled = true;
  let aopr = "read";

    void window.rtFrameDetectAdblock;

  parent.postMessage(`frame constant=${window.rtFrameAdsEnabled} aopr=${aopr}`, "*");
