<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--rt-statusbar-bg, #061826);
    --fg: var(--rt-statusbar-fg, #e9f7f6);
    --insert-bg: var(--rt-statusbar-insert-bg, #0d6e5a);
    --insert-fg: var(--rt-statusbar-insert-fg, #e9f7f6);
    --passthrough-bg: var(--rt-statusbar-passthrough-bg, #24418f);
    --passthrough-fg: var(--rt-statusbar-passthrough-fg, #e9f7f6);
    --error-bg: var(--rt-messages-error-bg, #b8323f);
    --error-msg-fg: var(--rt-messages-error-fg, #e9f7f6);
    --warning-bg: var(--rt-messages-warning-bg, #a8651a);
    --warning-msg-fg: var(--rt-messages-warning-fg, #e9f7f6);
    --private-bg: var(--rt-statusbar-private-bg, #3b4a5a);
    --private-fg: var(--rt-statusbar-private-fg, #e9f7f6);
    --https: var(--rt-statusbar-https-fg, #2ec4b6);
    --http: var(--rt-statusbar-http-fg, #e9f7f6);
    --error-fg: var(--rt-statusbar-url-error-fg, #f4c56a);
    --font: var(--rt-font-statusbar, 10pt "DejaVu Sans Mono", "Monospace", monospace);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: var(--font);
    user-select: none;
    cursor: default;
  }
  #bar {
    display: flex;
    align-items: center;
    height: 100%;
    box-sizing: border-box;
    padding: var(--rt-statusbar-padding, 0 4px);
    white-space: pre;
    gap: 1ch;
  }
  #bar.private { background: var(--private-bg); color: var(--private-fg); }
  #bar.insert { background: var(--insert-bg); color: var(--insert-fg); }
  #bar.passthrough { background: var(--passthrough-bg); color: var(--passthrough-fg); }
  #bar.msg-error { background: var(--error-bg); color: var(--error-msg-fg); }
  #bar.msg-warning { background: var(--warning-bg); color: var(--warning-msg-fg); }
  #left, #right { line-height: 1.5; }
  #left { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #right { display: flex; gap: 1ch; flex-shrink: 1; min-width: 0; overflow: hidden; }
  #right > span:empty { display: none; }
  .url { overflow: hidden; text-overflow: ellipsis; }
  /* Messages and the command line get priority over a long URL. */
  #bar.busy #right { max-width: 40%; }
  .url.https { color: var(--https); }
  .url.http { color: var(--http); }
  .url.error { color: var(--error-fg); }
  .sharing { color: var(--error-fg); font-weight: bold; }
  /* On a coloured bar (a mode, a private window, a message), everything
     takes the bar's own text colour so it stays readable. */
  #bar.insert .url, #bar.passthrough .url, #bar.private .url,
  #bar.msg-error .url, #bar.msg-warning .url { color: inherit; }
  .cursor { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
<div id="bar"><span id="left"></span><span id="right"></span></div>
<script>
  // Ctrl+scroll would zoom this page, and riptide sizes it for 100%.
  addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false, capture: true });
  const $ = (id) => document.getElementById(id);

  function renderCommandLine(el, { text, cursor }) {
    const chars = Array.from(text);
    el.textContent = chars.slice(0, cursor).join("");
    const caret = document.createElement("span");
    caret.className = "cursor";
    caret.textContent = chars[cursor] ?? " ";
    el.append(caret, chars.slice(cursor + 1).join(""));
  }

  // A subset of strftime for the clock widget: %H %I %M %S %p %a %A %b %B %d %m %y %Y %%.
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August",
    "September", "October", "November", "December"];
  const pad = (n) => String(n).padStart(2, "0");
  function strftime(format, d) {
    return format.replace(/%([HIMSpaAbBdmyY%])/g, (_, c) => ({
      H: pad(d.getHours()), I: pad(d.getHours() % 12 || 12), M: pad(d.getMinutes()),
      S: pad(d.getSeconds()), p: d.getHours() < 12 ? "AM" : "PM",
      a: DAYS[d.getDay()].slice(0, 3), A: DAYS[d.getDay()],
      b: MONTHS[d.getMonth()].slice(0, 3), B: MONTHS[d.getMonth()],
      d: pad(d.getDate()), m: pad(d.getMonth() + 1), y: pad(d.getFullYear() % 100),
      Y: String(d.getFullYear()), "%": "%",
    })[c]);
  }

  function scrollText(scroll) {
    if (scroll == null) return "";
    if (scroll < 0) return "[All]";
    if (scroll === 0) return "[Top]";
    if (scroll === 100) return "[Bot]";
    return `[${scroll}%]`;
  }

  // One span per widget, in statusbar.widgets order; empty ones are hidden by CSS.
  function widget(name, state) {
    const el = document.createElement("span");
    const text = (t) => { el.textContent = t; return el; };
    if (name.startsWith("text:")) return text(name.slice(5));
    if (name === "clock" || name.startsWith("clock:")) {
      el.className = "clock";
      el.dataset.format = name.startsWith("clock:") ? name.slice(6) : "%H:%M";
      return text(strftime(el.dataset.format, new Date()));
    }
    switch (name) {
      case "keypress": return text(state.keystring);
      case "downloads": return text(state.downloads);
      case "muted": return text(state.muted ? "[muted]" : "");
      case "media": return text(state.media || "");
      case "sharing":
        el.className = "sharing";
        el.title = ":share-stop stops it";
        return text(state.sharing ? `[sharing ${state.sharing}]` : "");
      case "blocked":
        el.title = "Requests the ad blocker stopped on this page";
        return text(state.blocked ? `⊘${state.blocked}` : "");
      case "zoom": return text(state.zoom === 100 ? "" : `[${state.zoom}%]`);
      case "search_match":
        return text(state.search_match ? `Match [${state.search_match[0]}/${state.search_match[1]}]` : "");
      case "url":
        el.className = "url " + (state.load_error ? "error" : state.url.startsWith("https:") ? "https" : "http");
        return text(state.url);
      case "scroll": return text(scrollText(state.scroll));
      case "scroll_raw": return text(state.scroll == null ? "" : `[${Math.max(0, state.scroll)}]`);
      case "history": {
        const marks = (state.back ? "<" : "") + (state.forward ? ">" : "");
        return text(marks ? `[${marks}]` : "");
      }
      case "tabs": return text(`[${state.tab_index}/${state.tab_count}]`);
      case "progress": return text(state.progress == null ? "" : `[${Math.round(state.progress * 100)}%]`);
      default: return text("");
    }
  }

  function renderWidgets(state) {
    $("right").replaceChildren(...(state.widgets || []).map((name) => widget(name, state)));
  }

  // Clocks tick on their own between updates.
  setInterval(() => {
    for (const el of document.querySelectorAll(".clock")) el.textContent = strftime(el.dataset.format, new Date());
  }, 1000);


  // The height one line of text needs in `font`, at `lineHeight`.
  function lineBox(font, lineHeight) {
    const probe = document.createElement("span");
    probe.textContent = "Mg";
    probe.style.cssText = `position:absolute;visibility:hidden;white-space:pre;font:${font};line-height:${lineHeight}`;
    document.body.append(probe);
    const height = probe.getBoundingClientRect().height;
    probe.remove();
    return height;
  }
  // Tell the browser how big this page wants to be, when that changes, so
  // fonts, padding and ui.css change the real size instead of clipping.
  let reportedSize = "";
  function reportSize(size) {
    const json = JSON.stringify(size);
    if (json === reportedSize) return;
    reportedSize = json;
    rt.send("size", json);
  }

  function measure() {
    const bar = $("bar");
    const style = getComputedStyle(bar);
    const pad = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
    reportSize({ height: Math.ceil(lineBox(style.font, 1.5) + pad) });
  }

  // ui.css from the config directory, after the page's own styles.
  let appliedCss = null;
  function applyCss(css) {
    if (css === undefined || css === appliedCss) return;
    appliedCss = css;
    let style = document.getElementById("user-css");
    if (!style) {
      style = document.createElement("style");
      style.id = "user-css";
      document.head.append(style);
    }
    style.textContent = css;
  }

  // ui.theme and colors.*: the browser sends them as --rt-<token> variables.
  let appliedTheme = "";
  function applyTheme(theme) {
    if (!theme) return;
    const key = JSON.stringify(theme);
    if (key === appliedTheme) return;
    appliedTheme = key;
    for (const [token, color] of Object.entries(theme)) {
      document.documentElement.style.setProperty(`--rt-${token}`, color);
    }
  }

  window.rtRender = (state) => {
    applyTheme(state.theme);
    applyCss(state.css);
    measure();
    const bar = $("bar");
    const left = $("left");
    bar.className = state.mode;
    if (state.private) bar.classList.add("private");
    if (state.command_line || state.message) bar.classList.add("busy");
    if (state.command_line) {
      renderCommandLine(left, state.command_line);
    } else if (state.message) {
      bar.classList.add(`msg-${state.message.level}`);
      left.textContent = state.message.text;
    } else if (state.mode === "normal") {
      left.textContent = "";
    } else {
      left.textContent = `-- ${state.mode.toUpperCase()} MODE --`;
    }
    renderWidgets(state);
  };
  // ui.theme = auto: tell the browser whether pages are asked for dark
  // colors, now and whenever that changes.
  const darkQuery = matchMedia("(prefers-color-scheme: dark)");
  const sendScheme = () => rt.send("color-scheme", JSON.stringify({ dark: darkQuery.matches }));
  darkQuery.addEventListener("change", sendScheme);
  sendScheme();
</script>
</body>
</html>
