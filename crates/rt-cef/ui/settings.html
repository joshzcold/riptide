<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
  :root {
    color-scheme: light dark;
    --base: #e6f0f3; --bg: #f7fbfc; --fg: #0b2233; --muted: #4f6b7a; --line: #d3e5ea; --accent: #0e7fa6; --panel: #e6f2f4;
    --selected-bg: #0e7fa6; --selected-fg: #ffffff; --error: #b8323f;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --base: #061826; --bg: #0b2a3f; --fg: #e9f7f6; --muted: #8fb3c4; --line: #164260; --accent: #2ec4b6; --panel: #12364f;
      --selected-bg: #2ec4b6; --selected-fg: #061826; --error: #b8323f; }
  }
  * { box-sizing: border-box; }
  :root { --header: 5.4rem; }
  html { scroll-padding-top: calc(var(--header) + 1rem); }
  body { margin: 0; background: var(--base); color: var(--fg); font: 14px/1.5 var(--sans); }
  svg.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  header { position: sticky; top: 0; z-index: 3; background: var(--base); border-bottom: 1px solid var(--line); }
  .bar { max-width: 76rem; margin: 0 auto; padding: .9rem 1.5rem; display: flex; gap: 1.25rem; align-items: center; }
  .bar h1 { font-size: 1.25rem; margin: 0; width: 13rem; flex: none; display: flex; gap: .5rem; align-items: center; }
  .bar h1 svg.icon { width: 22px; height: 22px; color: var(--accent); }
  #search { flex: 1; max-width: 34rem; padding: .45rem .7rem; background: var(--bg); }
  .toggle { display: flex; gap: .4rem; align-items: center; color: var(--muted); white-space: nowrap; }

  .layout { max-width: 76rem; margin: 0 auto; padding: 1.25rem 1.5rem 4rem; display: grid; grid-template-columns: 13rem minmax(0, 1fr); gap: 1.25rem; }
  nav { position: sticky; top: calc(var(--header) + 1.25rem); align-self: start; display: flex; flex-direction: column; gap: 2px; }
  nav a { display: flex; gap: .6rem; align-items: center; padding: .4rem .6rem; border-radius: 6px; color: var(--muted); text-decoration: none; }
  nav a:hover { background: var(--bg); color: var(--fg); }
  nav a.current { background: var(--bg); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
  nav a.current svg.icon { color: var(--accent); }
  nav .count { margin-left: auto; font-size: .75em; color: var(--muted); }

  section { margin-bottom: 2rem; }
  section > h2 { display: flex; gap: .55rem; align-items: center; font-size: 1.05rem; margin: 0 0 .15rem; }
  section > h2 svg.icon { color: var(--accent); }
  section > .blurb { color: var(--muted); margin: 0 0 .7rem; font-size: .9em; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .limits { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .8rem; margin-bottom: .8rem; }
  .limits summary { cursor: pointer; font-weight: 600; }
  .limits ul { margin: .4rem 0; padding-left: 1.2rem; }
  .limits li { margin: .2rem 0; }
  .sub { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: .7rem 1rem .2rem; background: var(--bg); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 21rem); gap: .4rem 1.5rem; padding: .75rem 1rem; border-top: 1px solid var(--line); }
  .sub + .row { border-top: none; }
  .card > .row:first-child { border-top: none; }
  .row.changed { box-shadow: inset 3px 0 0 var(--accent); }
  .name { font: 600 .92em var(--mono); word-break: break-word; }
  .row.changed .name { color: var(--accent); }
  .desc { color: var(--muted); font-size: .88em; margin-top: .1rem; }
  .notes { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .35rem; }
  .note { font-size: .74em; padding: .05rem .45rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .note.wins { border-color: var(--accent); color: var(--accent); }
  .site-values { display: flex; flex-direction: column; gap: .3rem; margin-top: .45rem; }
  .site-values .pattern { font: .82em var(--mono); color: var(--muted); min-width: 10rem; }
  .site-values .line input[type=text] { max-width: 16rem; }
  .row.cursor, .keyrow.cursor { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
  .keys-help { margin-top: 1rem; padding: .5rem .6rem; font-size: .8em; color: var(--muted); }
  .error { grid-column: 1 / -1; color: var(--error); font-size: .85em; font-weight: 600; }

  input, select, button { font: inherit; color: var(--fg); background: var(--base); border: 1px solid var(--line); border-radius: 6px; padding: .3rem .55rem; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  input.invalid { border-color: var(--error); outline-color: var(--error); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .editor { display: flex; flex-direction: column; gap: .35rem; }
  .line { display: flex; gap: .35rem; align-items: center; }
  .line input[type=text], .line input[type=number], .line select { flex: 1; min-width: 0; }
  .reset { padding: .25rem .4rem; line-height: 0; color: var(--muted); }
  .reset svg.icon { width: 15px; height: 15px; }
  .add { align-self: flex-start; font-size: .85em; }
  .remove { padding: .25rem .5rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: .3rem; }
  .chip { display: inline-flex; align-items: center; gap: .15rem; padding: .05rem .1rem .05rem .55rem; border-radius: 999px; background: var(--panel); font: .85em var(--mono); }
  .chip-remove { border: none; background: none; padding: 0 .35rem; color: var(--muted); font-size: .85em; }
  .chip-remove:hover { color: var(--error); }
  input[type=checkbox] { width: 2.4rem; height: 1.35rem; appearance: none; border-radius: 999px; background: var(--panel); position: relative; cursor: pointer; padding: 0; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.35rem - 6px); height: calc(1.35rem - 6px); border-radius: 50%; background: var(--muted); transition: left .12s; }
  input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after { left: calc(100% - 1.35rem + 4px); background: var(--selected-fg); }
  .swatch { width: 2rem; height: 1.9rem; flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 0; position: relative; overflow: hidden; }
  .swatch input { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); opacity: 0; cursor: pointer; }
  .themes { font-size: .8em; color: var(--muted); }
  #empty { color: var(--muted); padding: 2rem; text-align: center; }

  .views { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; flex: none; }
  .views a { padding: .3rem .8rem; border-radius: 6px; color: var(--muted); text-decoration: none; }
  .views a.current { background: var(--selected-bg); color: var(--selected-fg); }
  kbd { font: .85em var(--mono); padding: .05rem .4rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--base); white-space: nowrap; }
  .keyrow { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr) auto; gap: .6rem; align-items: center; padding: .45rem 1rem; border-top: 1px solid var(--line); }
  .card > .keyrow:first-child { border-top: none; }
  .keyrow.changed { box-shadow: inset 3px 0 0 var(--accent); }
  .keyrow .seq { display: flex; gap: .2rem; flex-wrap: wrap; }
  .keyrow input { width: 100%; font-family: var(--mono); font-size: .9em; }
  .keyrow .actions { display: flex; gap: .3rem; align-items: center; }
  .addform { padding: .8rem 1rem; display: grid; grid-template-columns: minmax(8rem, 13rem) auto minmax(0, 1fr) auto; gap: .5rem; align-items: center; }
  .addform input { font-family: var(--mono); }
  .record.on { background: var(--error); color: #fff; border-color: var(--error); }
  .warn { padding: 0 1rem .7rem; font-size: .85em; color: var(--error); }
  .spacer { height: .9rem; }
  .note.state { justify-self: start; font-size: .82em; padding: .1rem .6rem; }
  .note.allowed { border-color: var(--ok, #0d6e5a); color: var(--fg); background: color-mix(in srgb, var(--ok, #0d6e5a) 35%, transparent); }
  .log { margin: .3rem 0 0; padding: 0 0 0 1.1rem; font: .85em/1.5 var(--mono); color: var(--muted); }
  .note.blocked { border-color: var(--error); color: var(--fg); background: color-mix(in srgb, var(--error) 30%, transparent); }
  .banner { background: var(--error); color: #fff; border-radius: 8px; padding: .5rem .8rem; margin-bottom: .8rem; font-weight: 600; }

  /* The colors preview: riptide's bars drawn with the --rt-* colors. */
  .preview { position: sticky; top: var(--header); z-index: 2; margin-bottom: .8rem; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font: 12px/18px var(--mono); box-shadow: 0 6px 18px rgb(0 0 0 / 25%); }
  .p-tabs { display: flex; background: var(--rt-tabs-bar-bg); }
  .p-tab { padding: 0 .6rem; color: var(--rt-tabs-fg); white-space: nowrap; overflow: hidden; }
  .p-tab.odd { background: var(--rt-tabs-odd-bg); flex: 1; }
  .p-tab.even { background: var(--rt-tabs-even-bg); flex: 1; }
  .p-tab.selected { background: var(--rt-tabs-selected-bg); color: var(--rt-tabs-selected-fg); flex: 1; box-shadow: inset 0 -2px 0 var(--rt-tabs-indicator-start); }
  .p-tab.pinned { background: var(--rt-tabs-pinned-bg); color: var(--rt-tabs-pinned-fg); }
  .p-page { background: var(--rt-webpage-bg, #ffffff); color: #333; padding: .6rem .8rem; display: flex; gap: 1.5rem; align-items: flex-start; min-height: 3.6rem; position: relative; font-family: var(--sans); }
  .p-link { color: #1a4fd6; text-decoration: underline; position: relative; }
  .p-hint { position: absolute; left: -.3rem; top: -.55rem; padding: 0 3px; font: bold 11px/14px var(--mono); border-radius: 3px; background: var(--rt-hints-bg); color: var(--rt-hints-fg); border: 1px solid var(--rt-hints-border); text-decoration: none; }
  .p-hint b { color: var(--rt-hints-match-fg); }
  .p-prompt { margin-left: auto; width: 19rem; background: var(--rt-prompts-bg); color: var(--rt-prompts-fg); border: 1px solid var(--rt-prompts-border); border-left-width: 3px; padding: .3rem .5rem; font: 11px/16px var(--mono); }
  .p-prompt .t { color: var(--rt-prompts-border); font-weight: bold; }
  .p-prompt kbd { background: var(--rt-prompts-key-bg); color: var(--rt-prompts-border); padding: 0 .35rem; border-radius: 3px; font: inherit; }
  .p-comp { background: var(--rt-completion-bg); color: var(--rt-completion-fg); }
  .p-comp .h { background: var(--rt-completion-category-bg); color: var(--rt-completion-category-fg); font-weight: bold; padding: 0 .5rem; }
  .p-comp .r { display: flex; justify-content: space-between; padding: 0 .5rem; }
  .p-comp .r span:last-child { color: var(--rt-completion-description-fg); }
  .p-comp .r.sel { background: var(--rt-completion-selected-bg); color: var(--rt-completion-selected-fg); }
  .p-comp .r.sel span:last-child { color: var(--rt-completion-selected-fg); }
  .p-comp .m { color: var(--rt-completion-match-fg); font-weight: bold; }
  .p-status { display: flex; justify-content: space-between; padding: 0 .5rem; background: var(--rt-statusbar-bg); color: var(--rt-statusbar-fg); }
  .p-status .u { color: var(--rt-statusbar-https-fg); }
  .p-status.insert { background: var(--rt-statusbar-insert-bg); color: var(--rt-statusbar-insert-fg); }
  .p-status.error { background: var(--rt-messages-error-bg); color: var(--rt-messages-error-fg); }
  .p-status.warning { background: var(--rt-messages-warning-bg); color: var(--rt-messages-warning-fg); }

  @media (max-width: 52rem) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav { display: none; }
    .bar h1 { width: auto; }
    .row { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</h1>
    <div class="views" role="tablist"><a href="#settings" data-view="settings" role="tab">Settings</a><a href="#keys" data-view="keys" role="tab">Keys</a><a href="#sites" data-view="sites" role="tab">Sites</a><a href="#plugins" data-view="plugins" role="tab">Plugins</a><a href="#extensions" data-view="extensions" role="tab">Extensions</a></div>
    <input id="search" type="search" placeholder="Search settings" autocomplete="off" aria-label="Search">
    <label class="toggle"><input id="changed" type="checkbox"> Changed only</label>
  </div>
</header>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="list"></main>
</div>
<script>
"use strict";
let page = /*RT_DATA*/null || { entries: [], theme: {} };
const errors = new Map();
const list = document.getElementById("list");
const nav = document.getElementById("nav");
const search = document.getElementById("search");
const changedOnly = document.getElementById("changed");

// Icon paths, drawn with the text color (no images: riptide pages load nothing).
const ICONS = {
  general: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  look: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  colors: '<path d="M12 3c-3.5 4.2-6 7.3-6 10.5a6 6 0 0 0 12 0C18 10.3 15.5 7.2 12 3z"/>',
  fonts: '<path d="M4 19l5-14 5 14M6 14h6M15 19c0-2 1.3-3 3-3s3 1 3 3v-5"/>',
  tabs: '<path d="M3 20V9a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8z"/><path d="M13 7h4l1.5 3"/>',
  statusbar: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16h18M6 18h4"/>',
  completion: '<path d="M5 7l4 4-4 4M12 17h7"/>',
  hints: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  keys: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h0M10 10h0M14 10h0M18 10h0M7 14h10"/>',
  content: '<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  url: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  files: '<path d="M12 4v11M7 10l5 5 5-5M5 19h14"/>',
  notifications: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  other: '<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>',
  reset: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6M4 4v4.6h4.6"/>',
  plugins: '<path d="M9 3v4M15 3v4M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"/>',
  extensions: '<path d="M4 8h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4H4z"/>',
  sites: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
};
const GROUPS = [
  { id: "general", title: "General", blurb: "Starting, sessions, quitting, updates and spell checking.",
    prefixes: ["auto_save", "session", "confirm_quit", "changelog_after_upgrade", "crash_report", "new_instance_open_target", "new_instance_open_target_window", "spellcheck"] },
  { id: "url", title: "URLs & search", blurb: "Start pages, search engines and how URLs are read.", prefixes: ["url", "search"] },
  { id: "look", title: "Look & feel", blurb: "Theme, window, zoom and scrolling.", prefixes: ["ui", "window", "zoom", "scrolling"] },
  { id: "notifications", title: "Notifications", blurb: "How site notifications reach you: Chromium's, riptide's own desktop notifications (libnotify) with their app name, urgency, timeout and icon, or the status bar.",
    prefixes: ["content.notifications", "messages"] },
  { id: "colors", title: "Colors", blurb: "Override single colors of the theme. Empty uses the theme's color, shown in the swatch.", prefixes: ["colors"] },
  { id: "fonts", title: "Fonts", blurb: "riptide's own fonts, and the default fonts of web pages.", prefixes: ["fonts"] },
  { id: "tabs", title: "Tabs", blurb: "The tab bar and how tabs open, close and move.", prefixes: ["tabs"] },
  { id: "statusbar", title: "Status bar", blurb: "Where the status bar sits and what it shows.", prefixes: ["statusbar"] },
  { id: "completion", title: "Command line", blurb: "Completion while typing commands, URLs and settings.", prefixes: ["completion"] },
  { id: "hints", title: "Hints", blurb: "Labels for following links and clicking elements.", prefixes: ["hints"] },
  { id: "keys", title: "Keys & input", blurb: "Bindings, aliases, key hints and insert mode.", prefixes: ["bindings", "aliases", "input", "keyhint"] },
  { id: "content", title: "Pages & privacy", blurb: "What pages may do, blocking, cookies and permissions.", prefixes: ["content"] },
  { id: "files", title: "Downloads & prompts", blurb: "Downloads, file pickers, the editor and questions.", prefixes: ["downloads", "fileselect", "editor", "prompt"] },
];
// The group whose prefix matches the most of the name: content.notifications.* is
// Notifications, the rest of content.* Pages & privacy.
const OTHER = { id: "other", title: "Other", blurb: "", prefixes: [] };
function matchOf(e) {
  let best = { group: OTHER, prefix: e.section };
  for (const group of GROUPS) {
    for (const prefix of group.prefixes) {
      const hit = e.name === prefix || e.name.startsWith(`${prefix}.`);
      if (hit && (best.group === OTHER || prefix.length > best.prefix.length)) best = { group, prefix };
    }
  }
  return best;
}
const groupOf = (e) => matchOf(e).group;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function icon(name) {
  const span = document.createElement("span");
  span.innerHTML = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.other}</svg>`;
  return span.firstChild;
}

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const shown = (v) => (typeof v === "string" ? v : JSON.stringify(v));
// What was last sent per setting, so a refused value stays in its field.
const attempted = new Map();
function send(name, value) {
  attempted.set(name, value);
  rt.send("set", JSON.stringify({ name, value }));
}
// `value`, when given, is what was typed, kept in the field to be fixed.
function fail(name, message, value) {
  if (value !== undefined) attempted.set(name, value);
  errors.set(name, message);
  render();
}

// Each control gets an id from its setting and position, so focus survives a redraw.
function control(e, node, id) {
  node.dataset.key = `${e.name}#${id}`;
  return node;
}
function textInput(e, value, id, onChange, type = "text") {
  const input = control(e, el("input"), id);
  input.type = type;
  input.value = value;
  input.setAttribute("aria-label", e.name);
  input.addEventListener("change", () => onChange(input.value, input));
  if (errors.has(e.name) && attempted.get(e.name) === value) input.classList.add("invalid");
  return input;
}
// The value to show: a refused one stays so it can be fixed.
const current = (e) => (errors.has(e.name) && attempted.has(e.name) ? attempted.get(e.name) : e.value);

const isColor = (v) => v === "" || CSS.supports("color", v);
function toHex(color) {
  const probe = document.createElement("canvas").getContext("2d");
  probe.fillStyle = "#000000";
  probe.fillStyle = color;
  return /^#[0-9a-f]{6}$/i.test(probe.fillStyle) ? probe.fillStyle : "#000000";
}

function colorEditor(e, line) {
  const token = e.editor.token;
  const value = current(e);
  const themeColor = page.theme[token] || "";
  const swatch = el("label", "swatch");
  swatch.title = "Pick a color";
  const paint = (c) => { swatch.style.background = c || themeColor; };
  paint(isColor(value) ? value : "");
  const picker = control(e, el("input"), "picker");
  picker.type = "color";
  picker.value = toHex(value || themeColor);
  picker.setAttribute("aria-label", `${e.name} color`);
  const text = textInput(e, value, "text", (v, input) => {
    if (!isColor(v.trim())) return fail(e.name, `${v} isn't a color, e.g. #2ec4b6, rgb(46, 196, 182) or teal`, v);
    send(e.name, v.trim());
  });
  text.placeholder = themeColor ? `theme: ${themeColor}` : "the theme's";
  // Typing and picking show in the preview at once; the change saves on Return or leaving.
  const live = (c) => {
    paint(c);
    if (token) document.querySelector(".preview")?.style.setProperty(`--rt-${token}`, c || themeColor);
  };
  text.addEventListener("input", () => {
    const ok = isColor(text.value.trim());
    text.classList.toggle("invalid", !ok);
    if (ok) live(text.value.trim());
  });
  picker.addEventListener("input", () => { text.value = picker.value; text.classList.remove("invalid"); live(picker.value); });
  picker.addEventListener("change", () => send(e.name, picker.value));
  swatch.append(picker);
  line.append(swatch, text);
}

function editor(e) {
  const box = el("div", "editor");
  const kind = e.editor.type;
  const line = el("div", "line");
  box.append(line);
  const value = current(e);
  if (kind === "bool") {
    const input = control(e, el("input"), "bool");
    input.type = "checkbox";
    input.checked = !!value;
    input.setAttribute("aria-label", e.name);
    input.addEventListener("change", () => send(e.name, input.checked));
    line.append(input);
  } else if (kind === "enum") {
    const select = control(e, el("select"), "enum");
    for (const option of e.editor.options) select.append(new Option(option, option));
    select.value = value;
    select.setAttribute("aria-label", e.name);
    select.addEventListener("change", () => send(e.name, select.value));
    line.append(select);
  } else if (kind === "int") {
    const { min, max } = e.editor;
    const input = textInput(e, value, "int", (v, input) => {
      const n = Number(v);
      if (!Number.isInteger(n) || n < min || n > max) return fail(e.name, `Enter a whole number from ${min} to ${max}`, v);
      send(e.name, n);
    }, "number");
    input.min = min;
    input.max = max;
    input.step = 1;
    input.addEventListener("input", () => {
      const n = Number(input.value);
      input.classList.toggle("invalid", input.value === "" || !Number.isInteger(n) || n < min || n > max);
    });
    line.append(input);
  } else if (kind === "color") {
    colorEditor(e, line);
  } else if (kind === "str") {
    line.append(textInput(e, value, "str", (v) => send(e.name, v)));
  } else if (kind === "list") {
    // Items as chips; a field at the end adds one.
    box.replaceChildren();
    const items = Array.isArray(value) ? value : [];
    const chips = el("div", "chips");
    items.forEach((item, i) => {
      const chip = el("span", "chip", item);
      const remove = control(e, el("button", "chip-remove", "✕"), `remove${i}`);
      remove.title = `Remove ${item}`;
      remove.setAttribute("aria-label", `Remove ${item}`);
      remove.addEventListener("click", () => send(e.name, items.filter((_, j) => j !== i)));
      chip.append(remove);
      chips.append(chip);

    const line = el("div", "line");
    const input = textInput(e, "", "new", (v) => {
      const item = v.trim();

    const without = (key) => Object.fromEntries(Object.entries(map).filter(([k]) => k !== key));
    Object.keys(map).forEach((key, i) => {
      const row = el("div", "line");
      const k = textInput(e, key, `key${i}`, (v) => v && send(e.name, { ...without(key), [v]: map[key] }));
      const v = textInput(e, shown(map[key]), `value${i}`, (text) => send(e.name, { ...map, [key]: text }));
      const remove = control(e, el("button", "remove", "✕"), `remove${i}`);
      remove.title = "Remove";
      remove.addEventListener("click", () => send(e.name, without(key)));
      row.append(k, v, remove);
      box.append(row);
    });
    const add = control(e, el("button", "add", "+ Add"), "add");
    add.addEventListener("click", () => {
      const row = el("div", "line");
      const k = textInput(e, "", "newkey", () => {});
      const v = textInput(e, "", "newvalue", (text) => k.value && send(e.name, { ...map, [k.value]: text }));
      k.placeholder = "key";
      v.placeholder = "value";
      row.append(k, v);
      add.before(row);
      k.focus();
    });
    box.append(add);
  }
  if (!same(e.value, e.default)) {
    const reset = control(e, el("button", "reset"), "reset");
    reset.title = `Reset to the default: ${shown(e.default) || "empty"}`;
    reset.setAttribute("aria-label", `Reset ${e.name}`);
    reset.append(icon("reset"));
    reset.addEventListener("click", () => rt.send("reset", JSON.stringify({ name: e.name })));
    (kind === "list" || kind === "map" ? box : line).append(reset);
  }
  return box;
}

function row(e) {
  const r = el("div", same(e.value, e.default) ? "row" : "row changed");
  r.dataset.name = e.name;
  const about = el("div");
  about.append(el("div", "name", e.name), el("div", "desc", e.description));
  const notes = el("div", "notes");
  if (e.source) notes.append(el("span", "note", `set in ${e.source}`));
  if (e.config_wins) notes.append(el("span", "note wins", "your config file sets this and wins at startup"));
  if (e.restart) notes.append(el("span", "note", "applies after a restart"));
  if (notes.childElementCount) about.append(notes);
  if (e.per_site) about.append(siteValues(e));
  r.append(about, editor(e));
  if (errors.has(e.name)) r.append(el("div", "error", errors.get(e.name)));
  return r;
}

// A per-site setting's values: each pattern's value, editable, and a way to add one.
function siteControl(e, value, id, onChange) {
  const kind = e.editor.type;
  if (kind === "bool") {
    const input = control(e, el("input"), id);
    input.type = "checkbox";
    input.checked = !!value;
    input.addEventListener("change", () => onChange(input.checked));
    return input;
  }
  if (kind === "enum") {
    const select = control(e, el("select"), id);
    for (const option of e.editor.options) select.append(new Option(option, option));
    select.value = value;
    select.addEventListener("change", () => onChange(select.value));
    return select;
  }
  const input = textInput(e, shown(value), id, (v) => onChange(kind === "int" ? Number(v) : v));
  return input;
}
function siteValues(e) {
  const box = el("div", "site-values");
  e.sites.forEach(([pattern, value], i) => {
    const line = el("div", "line");
    const ctl = siteControl(e, value, `site${i}`, (v) => rt.send("set", JSON.stringify({ name: e.name, value: v, pattern })));
    ctl.setAttribute("aria-label", `${e.name} for ${pattern}`);
    const remove = control(e, el("button", "remove", "✕"), `site-remove${i}`);
    remove.title = `Forget the value for ${pattern}`;
    remove.addEventListener("click", () => rt.send("unset-site", JSON.stringify({ pattern, name: e.name })));
    line.append(el("span", "pattern", pattern), ctl, remove);

  });
  const add = control(e, el("button", "add", "+ For a site"), "site-add");

    const line = el("div", "line");

    const save = control(e, el("button", null, "Save"), "site-save");
    save.addEventListener("click", () => {
      const p = pattern.value.trim();

      rt.send("set", JSON.stringify({ name: e.name, value, pattern: p }));

    line.append(pattern, ctl, save);

  return box;
}

let observer = null;
// Which tab of the page shows: settings, or keys (with the mode picked).
const view = { name: "settings", mode: "normal" };
function render() {
  draw();
  markCursor();
}
function draw() {
  for (const a of document.querySelectorAll(".views a")) a.classList.toggle("current", a.dataset.view === view.name);
  search.placeholder = { keys: "Search keys and commands", sites: "Search sites", plugins: "Search plugins", extensions: "Search extensions" }[view.name] || "Search settings";
  changedOnly.parentElement.style.display = ["sites", "plugins", "extensions"].includes(view.name) ? "none" : "";
  if (view.name === "sites") return renderSites();
  if (view.name === "plugins") return renderPlugins();
  if (view.name === "extensions") return renderExtensions();
  return view.name === "keys" ? renderKeys() : renderSettings();
}
function renderSettings() {
  const focused = document.activeElement?.dataset?.key;
  const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  const visible = page.entries.filter((e) => {
    if (changedOnly.checked && same(e.value, e.default)) return false;
    const hay = `${e.name} ${e.description}`.toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  const groups = new Map();
  for (const e of visible) {
    const g = groupOf(e);
    if (!groups.has(g.id)) groups.set(g.id, { group: g, entries: [] });
    groups.get(g.id).entries.push(e);
  }
  const order = [...GROUPS.map((g) => g.id), "other"];
  const sections = [];
  const links = [];
  for (const id of order) {
    const found = groups.get(id);
    if (!found) continue;
    const { group, entries } = found;
    const section = el("section");
    section.id = `section-${id}`;
    const h2 = el("h2");
    h2.append(icon(id), group.title);
    section.append(h2);
    if (group.blurb) section.append(el("p", "blurb", group.blurb));
    if (id === "colors") section.append(preview());
    const card = el("div", "card");
    // Sections made of several prefixes get a heading per prefix (ui,
    // zoom); big ones per second name part (colors.statusbar).
    // One-off settings come first, without a heading.
    const mixed = group.prefixes.length > 1;
    const split = mixed || entries.length > 10;
    const prefixOf = (x) => matchOf(x).prefix;
    const count = (p) => entries.filter((x) => prefixOf(x) === p).length;
    if (mixed) entries.sort((a, b) => (count(prefixOf(a)) > 1) - (count(prefixOf(b)) > 1) || (a.name < b.name ? -1 : 1));
    let sub = "";
    for (const e of entries) {
      const parts = e.name.split(".");
      const prefix = prefixOf(e);
      const part = mixed ? (count(prefix) > 1 ? prefix.split(".").pop() : "") : parts.length > 2 ? parts[1] : "";
      if (split && part !== sub) {
        if (part || sub) card.append(el("div", "sub", (part || "general").replaceAll("_", " ")));
        sub = part;
      }
      card.append(row(e));
    }
    section.append(card);
    sections.push(section);
    const link = el("a");
    link.href = `#section-${id}`;
    link.dataset.section = id;
    link.append(icon(id), group.title, el("span", "count", String(entries.length)));
    links.push(link);
  }
  if (!sections.length) {
    const empty = el("p", null, page.entries.length ? "No setting matches." : "No settings.");
    empty.id = "empty";
    sections.push(empty);
  }
  list.replaceChildren(...sections);
  const help = el("div", "keys-help", "j / k move between settings, Return edits one (switches toggle, choices step), f shows hints, Escape leaves a field.");
  nav.replaceChildren(...links, help);
  if (focused) list.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
  watchSections();
}

// The sidebar marks the section at the top of the view.
function watchSections() {
  observer?.disconnect();
  const visible = new Set();
  observer = new IntersectionObserver((seen) => {
    for (const s of seen) (s.isIntersecting ? visible.add(s.target.id) : visible.delete(s.target.id));
    const first = [...list.querySelectorAll("section")].find((s) => visible.has(s.id));
    for (const a of nav.querySelectorAll("a")) a.classList.toggle("current", first && a.dataset.section === first.id.slice(8));
  }, { rootMargin: "-90px 0px -55% 0px" });
  list.querySelectorAll("section").forEach((s) => observer.observe(s));
}

// j/k move the highlight between settings and Return edits the highlighted
// one; riptide sends these keys only in normal mode.
let cursorName = null;
const rowsShown = () => [...list.querySelectorAll(view.name === "settings" ? ".row" : ".keyrow")];
const rowName = (r) => r.dataset.name || r.textContent.slice(0, 80);
function markCursor() {
  const rows = rowsShown();
  for (const r of rows) r.classList.toggle("cursor", rowName(r) === cursorName);
}
window.rtKey = (key) => {
  const rows = rowsShown();
  if (!rows.length) return;
  let i = rows.findIndex((r) => rowName(r) === cursorName);
  if (i < 0) {
    // Start at the first row in view.
    const top = header.offsetHeight;
    i = Math.max(0, rows.findIndex((r) => r.getBoundingClientRect().bottom > top + 8));
    if (key !== "Return") key = "";
  }
  if (key === "j") i = Math.min(rows.length - 1, i + 1);
  if (key === "k") i = Math.max(0, i - 1);
  const row = rows[i];
  cursorName = rowName(row);
  document.activeElement?.blur();
  markCursor();
  row.scrollIntoView({ block: "nearest" });
  if (key !== "Return") return;
  const target = row.querySelector(".editor input:not([type=color]), .editor select, .editor button, input:not([type=color]), select, button");
  if (!target) return;
  if (target.type === "checkbox") return target.click();
  if (target.tagName === "SELECT") {
    // A script can't open the list, so Return steps to the next choice.
    target.selectedIndex = (target.selectedIndex + 1) % target.options.length;
    return target.dispatchEvent(new Event("change"));
  }
  target.focus();
  if (target.select) target.select();
};

// The browser calls these after a change, and when one is refused.
// The Keys tab.
const tokens = (keys) => keys.match(/<[^>]+>|./gsu) || [];
const startsWith = (a, b) => b.length <= a.length && b.every((t, i) => t === a[i]);
// Bindings `keys` would clash with: one is the start of the other.
function conflicts(mode, keys) {
  const t = tokens(keys);
  if (!t.length) return [];
  return mode.bindings.filter((b) => {
    const o = tokens(b.keys);
    return o.join("") !== t.join("") && (startsWith(t, o) || startsWith(o, t));
  });
}
function keyChips(keys) {
  const seq = el("span", "seq");
  for (const t of tokens(keys)) seq.append(el("kbd", null, t));
  return seq;
}
const bind = (mode, keys, command) => rt.send("bind", JSON.stringify({ mode, keys, command }));
const unbind = (mode, keys) => rt.send("unbind", JSON.stringify({ mode, keys }));

// Pressed keys as riptide writes them, e.g. <Ctrl-d>; null for a lone modifier.
const NAMES = { " ": "Space", Enter: "Return", Escape: "Escape", Tab: "Tab", Backspace: "Backspace", Delete: "Delete",
  Insert: "Insert", Home: "Home", End: "End", PageUp: "PgUp", PageDown: "PgDown", ArrowUp: "Up", ArrowDown: "Down",
  ArrowLeft: "Left", ArrowRight: "Right", "<": "Less", ">": "Greater" };
function keyToken(e) {
  if (["Shift", "Control", "Alt", "Meta", "CapsLock", "AltGraph"].includes(e.key)) return null;
  const name = NAMES[e.key] || (/^F\d{1,2}$/.test(e.key) || e.key.length === 1 ? e.key : null);
  if (!name) return null;
  const named = name.length > 1;
  const mods = `${e.ctrlKey ? "Ctrl-" : ""}${e.altKey ? "Alt-" : ""}${e.metaKey ? "Meta-" : ""}${e.shiftKey && named ? "Shift-" : ""}`;
  return mods || named ? `<${mods}${name}>` : name;
}
let recording = null;
addEventListener("keydown", (e) => {
  if (!recording) return;
  const token = keyToken(e);
  if (!token) return;
  e.preventDefault();
  e.stopPropagation();
  recording.input.value += token;
  recording.input.dispatchEvent(new Event("input"));
  clearTimeout(recording.timer);
  recording.timer = setTimeout(stopRecording, 1500);
}, true);
function stopRecording() {
  if (!recording) return;
  clearTimeout(recording.timer);
  recording.button.classList.remove("on");
  recording.button.textContent = "● Record";
  recording = null;
}

function renderKeys() {
  observer?.disconnect();
  const focused = document.activeElement?.dataset?.key;
  const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  const modes = page.keys || [];
  const mode = modes.find((m) => m.mode === view.mode) || modes[0];
  if (!mode) return;
  const changedRow = (b) => b.default !== b.command;
  nav.replaceChildren(...modes.map((m) => {
    const a = el("a");
    a.href = `#keys/${m.mode}`;
    a.classList.toggle("current", m === mode);
    a.append(icon("keys"), m.mode, el("span", "count", String(m.bindings.length)));
    return a;
  }));

  const section = el("section");
  const h2 = el("h2");
  h2.append(icon("keys"), `${mode.mode} mode`);
  section.append(h2, el("p", "blurb", "Type keys in riptide's notation (gx, <Ctrl-y>, <Space>) or press Record and the keys. Changes are saved in autoconfig.toml, like :bind."));
  if (errors.has("keys")) section.append(el("div", "banner", errors.get("keys")));

  // Adding a binding, with what it would clash with.
  const add = el("div", "card");
  const form = el("div", "addform");
  const keysInput = control({ name: "keys" }, el("input"), "newkeys");
  keysInput.placeholder = "Keys, e.g. gx";
  keysInput.setAttribute("aria-label", "Keys");
  const record = control({ name: "keys" }, el("button", "record", "● Record"), "record");
  const commandInput = control({ name: "keys" }, el("input"), "newcommand");
  commandInput.placeholder = "Command, e.g. tab-close";
  commandInput.setAttribute("aria-label", "Command");
  const addButton = control({ name: "keys" }, el("button", null, "Bind"), "bind");
  const warn = el("div", "warn");
  const check = () => {
    const clash = conflicts(mode, keysInput.value);
    const same = mode.bindings.find((b) => b.keys === keysInput.value);
    warn.textContent = [
      same ? `Replaces ${same.keys} → ${same.command}.` : "",
      clash.length ? `Clashes with ${clash.slice(0, 4).map((b) => `${b.keys} → ${b.command}`).join(", ")}: riptide waits to see which you mean.` : "",
    ].join(" ").trim();
  };
  keysInput.addEventListener("input", check);
  record.addEventListener("click", () => {
    if (recording) return stopRecording();
    keysInput.value = "";
    check();
    recording = { input: keysInput, button: record, timer: 0 };
    record.classList.add("on");
    record.textContent = "■ Stop";
    keysInput.focus();
  });
  const submit = () => {
    stopRecording();
    if (!keysInput.value.trim() || !commandInput.value.trim()) return fail("keys", "Enter both the keys and a command");
    bind(mode.mode, keysInput.value.trim(), commandInput.value.trim());
  };
  addButton.addEventListener("click", submit);
  commandInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  form.append(keysInput, record, commandInput, addButton);
  add.append(form, warn);
  section.append(add, el("div", "spacer"));

  // The bindings, filtered.
  const visible = mode.bindings.filter((b) => {
    if (changedOnly.checked && !changedRow(b)) return false;
    const hay = `${b.keys} ${b.command}`.toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  const card = el("div", "card");
  for (const b of visible) {
    const row = el("div", changedRow(b) ? "keyrow changed" : "keyrow");
    const command = control({ name: `keys:${mode.mode}:${b.keys}` }, el("input"), "command");
    command.value = b.command;
    command.setAttribute("aria-label", `Command for ${b.keys}`);
    command.addEventListener("change", () => command.value.trim() && bind(mode.mode, b.keys, command.value.trim()));
    const actions = el("div", "actions");
    if (b.default === null) actions.append(el("span", "note", "added"));
    else if (b.default !== b.command) {
      const restore = control({ name: `keys:${mode.mode}:${b.keys}` }, el("button", "reset"), "restore");
      restore.title = `Restore the default: ${b.default}`;
      restore.setAttribute("aria-label", `Restore ${b.keys}`);
      restore.append(icon("reset"));
      restore.addEventListener("click", () => bind(mode.mode, b.keys, b.default));
      actions.append(restore);
    }
    const remove = control({ name: `keys:${mode.mode}:${b.keys}` }, el("button", "remove", "✕"), "unbind");
    remove.title = `Unbind ${b.keys}`;
    remove.setAttribute("aria-label", `Unbind ${b.keys}`);
    remove.addEventListener("click", () => unbind(mode.mode, b.keys));
    actions.append(remove);
    row.append(keyChips(b.keys), command, actions);
    card.append(row);
  }
  if (!visible.length) {
    const empty = el("p", null, "No bindings match.");
    empty.id = "empty";
    card.append(empty);
  }
  section.append(card);

  // Defaults that were unbound, to bring back.
  const removed = mode.removed.filter(([k, c]) => words.every((w) => `${k} ${c}`.toLowerCase().includes(w)));
  if (removed.length) {
    const h3 = el("h2");
    h3.append("Unbound defaults");
    const gone = el("div", "card");
    for (const [keys, command] of removed) {
      const row = el("div", "keyrow");
      const restore = control({ name: `keys:${mode.mode}:${keys}` }, el("button", null, "Restore"), "restore");
      restore.addEventListener("click", () => bind(mode.mode, keys, command));
      row.append(keyChips(keys), el("span", "desc", command), restore);
      gone.append(row);
    }
    section.append(el("div", "spacer"), h3, gone);
  }
  list.replaceChildren(section);
  if (focused) list.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
}

// The Sites tab.
const SITE_LABELS = {

  "content.desktop_capture": "Screen sharing", "content.mouse_lock": "Pointer lock",
  "content.register_protocol_handler": "Handling links", "content.tls.certificate_errors": "Certificate errors",
  "content.javascript.enabled": "JavaScript", "content.cookies.accept": "Cookies",

const clearable = (pattern) => /^(https?:\/\/)?(\*\.)?[\w.-]+(:\d+)?\/?$/.test(pattern);
const clearSite = (site) => rt.send("clear-site", JSON.stringify({ site }));
const forget = (pattern, name) => rt.send("unset-site", JSON.stringify({ pattern, name }));

function renderSites() {
  observer?.disconnect();
  const focused = document.activeElement?.dataset?.key;
  const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  const sites = (page.sites || []).filter((s) => {
    const hay = `${s.pattern} ${s.settings.map(([n]) => `${n} ${SITE_LABELS[n] || ""}`).join(" ")}`.toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  nav.replaceChildren(...sites.map((s, i) => {
    const a = el("a");
    a.href = `#site-${i}`;
    a.append(icon("sites"), el("span", null, s.pattern), el("span", "count", String(s.settings.length)));
    return a;
  }));
  const section = el("section");
  const h2 = el("h2");
  h2.append(icon("sites"), "Sites");
  section.append(h2, el("p", "blurb", "Answers you saved with A or N when a site asked for a permission, certificate exceptions, and other per-site values (:set -u). One-time y answers are kept by Chromium itself and aren't listed."));
  if (errors.has("sites")) section.append(el("div", "banner", errors.get("sites")));

  const card = el("div", "card");
  const form = el("div", "addform");
  form.style.gridTemplateColumns = "minmax(0, 1fr) auto";
  const input = control({ name: "sites" }, el("input"), "clear");
  input.placeholder = "Clear cookies and site data for a site, e.g. example.com";
  input.setAttribute("aria-label", "Site to clear");
  const button = control({ name: "sites" }, el("button", null, "Clear"), "clear-button");
  const submit = () => {
    const site = input.value.trim();
    if (!clearable(site)) return fail("sites", `${site || "That"} isn't a site; enter a host like example.com or an origin like https://example.com`);
    clearSite(site);
    input.value = "";
  };
  button.addEventListener("click", submit);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  form.append(input, button);
  card.append(form);
  section.append(card, el("div", "spacer"));

  sites.forEach((site, i) => {
    const block = el("div", "card");
    block.id = `site-${i}`;
    const head = el("div", "keyrow");
    head.style.gridTemplateColumns = "minmax(0, 1fr) auto";
    const actions = el("div", "actions");
    if (clearable(site.pattern)) {
      const clear = control({ name: `site:${site.pattern}` }, el("button", null, "Clear data"), "clear");
      clear.title = `Clear cookies and site data for ${site.pattern}`;
      clear.addEventListener("click", () => clearSite(site.pattern));
      actions.append(clear);
    }
    const all = control({ name: `site:${site.pattern}` }, el("button", null, "Forget all"), "forget-all");
    all.title = `Forget every value saved for ${site.pattern}`;
    all.addEventListener("click", () => site.settings.forEach(([name]) => forget(site.pattern, name)));
    actions.append(all);
    head.append(el("div", "name", site.pattern), actions);
    block.append(head);
    for (const [name, value] of site.settings) {
      const row = el("div", "keyrow");
      const about = el("div");
      about.append(el("div", null, SITE_LABELS[name] || name), el("div", "desc", name));
      const label = VALUE_LABELS[shown(value)] || shown(value);
      const revoke = control({ name: `site:${site.pattern}:${name}` }, el("button", "remove", "✕"), "forget");
      revoke.title = `Forget ${SITE_LABELS[name] || name} for ${site.pattern}`;
      revoke.setAttribute("aria-label", revoke.title);
      revoke.addEventListener("click", () => forget(site.pattern, name));
      const state = { true: "allowed", false: "blocked", block: "blocked", "load-insecurely": "allowed" }[shown(value)] || "";
      row.append(about, el("span", `note state ${state}`, label), revoke);
      block.append(row);
    }
    section.append(block, el("div", "spacer"));
  });
  if (!sites.length) {
    const empty = el("p", null, (page.sites || []).length ? "No site matches." : "No site has saved values yet.");
    empty.id = "empty";
    section.append(empty);
  }
  list.replaceChildren(section);
  if (focused) list.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
}

// The Plugins tab.
const PLUGIN_STATES = {
  loaded: ["Loaded", "allowed"], lazy: ["Loads when needed", ""], installing: ["Installing", ""], waiting: ["Waiting for approval", ""],
  refused: ["Not approved", "blocked"], failed: ["Failed", "blocked"], pending: ["Not loaded", ""],
};
const pluginAction = (name, action) => rt.send("plugin", JSON.stringify({ name, action }));

function renderPlugins() {
  observer?.disconnect();
  const focused = document.activeElement?.dataset?.key;
  const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  const plugins = (page.plugins || []).filter((p) => words.every((w) => `${p.name} ${p.description} ${p.src}`.toLowerCase().includes(w)));
  nav.replaceChildren(...plugins.map((p, i) => {
    const a = el("a");
    a.href = `#plugin-${i}`;
    a.append(icon("plugins"), el("span", null, p.name));
    return a;
  }));
  const section = el("section");
  const h2 = el("h2");
  h2.append(icon("plugins"), "Plugins");
  section.append(h2, el("p", "blurb", "Plugins added with rt.pack.add in config.lua. Ones from git stay on the commit in rt-pack-lock.json until you check for updates, read what changed, and update."));
  if (errors.has("plugins")) section.append(el("div", "banner", errors.get("plugins")));

  plugins.forEach((plugin, i) => {
    const block = el("div", "card");
    block.id = `plugin-${i}`;
    const head = el("div", "keyrow");
    head.style.gridTemplateColumns = "minmax(0, 1fr) auto auto";
    const about = el("div");
    about.append(el("div", "name", plugin.name));
    if (plugin.description) about.append(el("div", "desc", plugin.description));
    about.append(el("div", "desc", plugin.commit ? `${plugin.src} @ ${plugin.commit.slice(0, 12)}` : plugin.src));
    const [label, state] = PLUGIN_STATES[plugin.state] || [plugin.state, ""];
    const actions = el("div", "actions");
    const button = (text, action, title) => {
      const b = control({ name: `plugin:${plugin.name}:${action}` }, el("button", null, text), action);
      b.title = title;
      b.addEventListener("click", () => pluginAction(plugin.name, action));
      actions.append(b);
    };
    if (plugin.state === "lazy") button("Load now", "load", `Load ${plugin.name} without waiting`);
    if (plugin.git) button("Check for updates", "check", `Fetch ${plugin.name} and list new commits; nothing changes yet`);
    if (plugin.update) button(`Update (${plugin.update.log.length})`, "update", `Move ${plugin.name} to ${plugin.update.commit.slice(0, 12)} and reload`);
    if (plugin.approved.length && !plugin.trusted) button("Revoke", "revoke", `Forget the permissions you approved for ${plugin.name}; it asks again`);
    if (plugin.git) button("Remove", "remove", `Delete ${plugin.name}'s installed copy and lockfile entry`);
    head.append(about, el("span", `note state ${state}`, label), actions);
    block.append(head);
    const wide = (node) => { node.style.gridTemplateColumns = "minmax(0, 1fr)"; return node; };
    if (plugin.error) block.append(wide(el("div", "keyrow", plugin.error)));
    const perms = wide(el("div", "keyrow"));
    perms.append(el("div", "desc", plugin.trusted ? "Trusted: runs without the sandbox" : plugin.approved.length ? `Approved: ${plugin.approved.join(", ")}` : "No permissions approved"));
    if (plugin.triggers.length) perms.append(el("div", "desc", `Loads on ${plugin.triggers.join(", ")}`));
    block.append(perms);
    if (plugin.update) {
      const row = wide(el("div", "keyrow"));
      const box = el("div");
      box.append(el("div", null, `${plugin.update.log.length} new commit(s)`));
      const log = el("ul", "log");
      for (const line of plugin.update.log) log.append(el("li", null, line));
      box.append(log);
      row.append(box);
      block.append(row);
    }
    section.append(block, el("div", "spacer"));
  });
  if (!plugins.length) {
    const empty = el("p", null, (page.plugins || []).length ? "No plugin matches." : "No plugins yet. Add one with rt.pack.add in config.lua.");
    empty.id = "empty";
    section.append(empty);
  }
  list.replaceChildren(section);
  if (focused) list.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
}

// The Extensions tab.
const EXTENSION_STATES = {
  loaded: ["Loaded", "allowed"], new: ["Loads after a restart", ""], changed: ["Changed; restart to load it", ""],
};
const extensionAction = (id, action) => rt.send("extension", JSON.stringify({ id, action }));
const EXTENSION_LIMITS = [
  "Popups open in a tab, and can't act on the page you were on: per-site switches and \"fill this page\" buttons don't reach it. For logins, use the builtin passwords plugin.",
  "Only Manifest V3 extensions run. The original uBlock Origin and Firefox add-ons don't.",
  "Changes load after a restart.",
  "Updates aren't automatic: use Check for updates, or :extension-update.",
  "Private windows run no extensions.",
  "Remove extensions here. Chrome's own Remove only hides one until riptide restarts.",
];

// How to install: the steps, and a box for a store page.
function extensionInstall() {
  const box = el("div", "card");
  const body = el("div", "keyrow");
  body.style.gridTemplateColumns = "minmax(0, 1fr)";
  const text = el("div");
  text.append(el("div", "name", "Installing"));
  const steps = el("ol");
  const store = el("a", null, "Chrome Web Store");
  store.href = "https://chromewebstore.google.com/category/extensions";
  store.target = "_blank";
  const first = el("li", "desc");
  first.append("Find the extension on the ", store, ". Ignore its \"Switch to Chrome\" banner.");
  steps.append(
    first,
    el("li", "desc", "On the extension's page, run :extension-install, or click Add to Chrome if the store shows it. Or paste the page's address below."),
    el("li", "desc", "riptide shows what the extension can do and asks before installing, then offers to restart."),
  );
  const row = el("div", "actions");
  const input = el("input");
  input.type = "text";
  input.placeholder = "https://chromewebstore.google.com/detail/…";
  input.style.flex = "1";
  input.dataset.key = "extensions:install-source";
  const button = control({ name: "extensions:install" }, el("button", null, "Install"), "install");
  const install = () => {
    const source = input.value.trim();
    if (!/[a-p]{32}/.test(source)) return fail("extensions", "Paste an extension's Chrome Web Store page, or its id");
    rt.send("extension-install", JSON.stringify({ source }));
  };
  button.addEventListener("click", install);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") install(); });
  row.style.display = "flex";
  row.style.gap = ".5rem";
  row.append(input, button);
  text.append(steps, row);
  body.append(text);
  box.append(body);
  box.style.marginBottom = ".8rem";
  return box;
}

// What works differently from Chrome. Closing it is remembered; the page
// works without storage too.
function extensionLimits() {
  const box = el("details", "limits");
  let open = true;
  try { open = localStorage.getItem("extension-limits") !== "closed"; } catch {}
  box.open = open;
  box.append(el("summary", null, "What doesn't work like in Chrome"));
  const items = el("ul");
  for (const text of EXTENSION_LIMITS) items.append(el("li", "desc", text));
  const more = el("a", null, "All the limits, and what to do instead");
  more.href = "https://joshzcold.github.io/riptide/guide/extensions.html#limits";
  more.target = "_blank";
  box.append(items, more);
  box.addEventListener("toggle", () => {
    try { localStorage.setItem("extension-limits", box.open ? "open" : "closed"); } catch {}
  });
  return box;
}

function renderExtensions() {
  observer?.disconnect();
  const focused = document.activeElement?.dataset?.key;
  const all = page.extensions?.items || [];
  const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  const items = all.filter((x) => words.every((w) => `${x.name} ${x.description} ${x.id}`.toLowerCase().includes(w)));
  nav.replaceChildren(...items.map((x, i) => {
    const a = el("a");
    a.href = `#extension-${i}`;
    a.append(icon("extensions"), el("span", null, x.name));
    return a;
  }));
  const section = el("section");
  const h2 = el("h2");
  h2.append(icon("extensions"), "Extensions");
  section.append(h2, el("p", "blurb", "Chrome extensions, installed with :extension-install or listed in extensions.load. They load when riptide starts."));
  if (errors.has("extensions")) section.append(el("div", "banner", errors.get("extensions")));
  section.append(extensionInstall(), extensionLimits());
  const top = el("div", "actions");
  top.style.marginBottom = "10px";
  const topButton = (text, title, click) => {
    const b = control({ name: `extensions:${text}` }, el("button", null, text), text);
    b.title = title;
    b.addEventListener("click", click);
    top.append(b);
  };
  if (all.some((x) => x.installed)) topButton("Check for updates", "Ask the Web Store for newer versions; nothing changes yet", () => extensionAction("", "check"));
  topButton("Chrome's extensions page", "Turn extensions on or off, see their errors and details", () => extensionAction("", "chrome"));
  section.append(top);
  const removed = page.extensions?.removed || [];
  if (page.extensions?.restart) {
    const banner = el("div", "banner");
    banner.append(removed.length ? `Removed ${removed.join(", ")}. ` : "", "Restart to apply the changes. ");
    const b = control({ name: "extensions:restart" }, el("button", null, "Restart now"), "restart");
    b.addEventListener("click", () => rt.send("restart", "{}"));
    banner.append(b);
    section.append(banner);
  }

  items.forEach((x, i) => {
    const block = el("div", "card");
    block.id = `extension-${i}`;
    const head = el("div", "keyrow");
    head.style.gridTemplateColumns = "minmax(0, 1fr) auto auto";
    const about = el("div");
    about.append(el("div", "name", `${x.name} ${x.version}`));
    if (x.description) about.append(el("div", "desc", x.description));
    about.append(el("div", "desc", x.installed ? `Installed · ${x.id}` : `From ${x.folder} · ${x.id}`));
    const [label, state] = EXTENSION_STATES[x.state] || [x.state, ""];
    const actions = el("div", "actions");
    const button = (text, action, title) => {
      const b = control({ name: `extension:${x.id}:${action}` }, el("button", null, text), action);
      b.title = title;
      b.addEventListener("click", () => extensionAction(x.id, action));
      actions.append(b);
    };
    if (x.popup) button("Popup", "popup", `Open ${x.name}'s popup in a tab`);
    if (x.options) button("Options", "options", `Open ${x.name}'s options in a tab`);
    if (x.update) button(`Update to ${x.update}`, "update", `Download ${x.name} ${x.update}; you'll see what it asks for first`);
    if (x.installed) button("Remove", "remove", `Delete ${x.name}; it's gone after a restart`);
    head.append(about, el("span", `note state ${state}`, label), actions);
    block.append(head);
    const asks = el("div", "keyrow");
    asks.style.gridTemplateColumns = "minmax(0, 1fr)";
    asks.append(el("div", "desc", x.asks.length ? `Can ${x.asks.join("; ")}` : "Asks for nothing beyond its own pages"));
    block.append(asks);
    section.append(block, el("div", "spacer"));
  });
  if (!items.length) {
    const empty = el("p", null, all.length ? "No extension matches." : "No extensions yet. Install one with :extension-install and its Chrome Web Store page.");
    empty.id = "empty";
    section.append(empty);
  }
  list.replaceChildren(section);
  if (focused) list.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
}

// #settings, #keys, #keys/<mode>, #sites, #plugins or #extensions, or a place in one of them:
// #section-<id> (settings) or #site-<n> (sites).
function route() {
  const hash = location.hash.slice(1);
  const [name, mode] = hash.split("/");
  const anchor = /^(section|site|plugin|extension)-/.test(name) ? name : null;
  const before = view.name;
  if (name === "sites" || name.startsWith("site-")) {
    view.name = "sites";
  } else if (name === "plugins" || name.startsWith("plugin-")) {
    view.name = "plugins";
  } else if (name === "extensions" || name.startsWith("extension-")) {
    view.name = "extensions";
  } else if (name === "keys") {
    view.name = "keys";
    if (mode) view.mode = mode;
  } else {
    view.name = "settings";
  }
  // A link within the page shown: the browser scrolls there by itself.
  if (anchor && before === view.name && list.childElementCount) return;
  render();
  if (anchor) document.getElementById(anchor)?.scrollIntoView();
}
addEventListener("hashchange", route);

window.rtSettings = (data) => {
  page = data;
  errors.clear();
  attempted.clear();
  render();
};
window.rtSettingsError = (name, error) => fail(name, error);

// Sticky things sit right under the header, whatever its height.
const header = document.querySelector("header");
const measure = () => document.documentElement.style.setProperty("--header", `${header.offsetHeight}px`);
new ResizeObserver(measure).observe(header);
measure();

search.addEventListener("input", render);
changedOnly.addEventListener("change", render);
route();
</script>
</body>
