<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bar-bg: var(--rt-tabs-bar-bg, #0b2a3f);
    --odd-bg: var(--rt-tabs-odd-bg, #12364f);
    --even-bg: var(--rt-tabs-even-bg, #164260);
    --fg: var(--rt-tabs-fg, #e9f7f6);
    /* The current tab is the darkest. Its accent line is the same color
       unless colors.tabs.selected.accent sets one. */
    --selected-bg: var(--rt-tabs-selected-bg, #04121c);
    --selected-fg: var(--rt-tabs-selected-fg, #ffffff);
    --selected-accent: var(--selected-bg);
    --pinned-bg: var(--rt-tabs-pinned-bg, #1b5e86);
    --indicator-loading: var(--rt-tabs-indicator-start, #8fe3dc);
    --indicator-error: var(--rt-tabs-indicator-error, #ff6b6b);
    --font: var(--rt-font-tabs-unselected, 10pt "DejaVu Sans Mono", "Monospace", monospace);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bar-bg);
    color: var(--fg);
    font: var(--font);
    user-select: none;
    cursor: default;
  }
  #tabs { display: flex; height: 100%; overflow-x: auto; scrollbar-width: none; }
  .tab {
    flex: 1 1 0;
    min-width: var(--tab-min-width, 0);
    max-width: var(--tab-max-width, none);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 4px 0 0;
    white-space: pre;
    line-height: 1.5;
    box-sizing: border-box;
  }
  .tab:nth-child(odd) { background: var(--odd-bg); }
  .tab:nth-child(even) { background: var(--even-bg); }
  .tab.pinned { background: var(--pinned-bg); }
  .tab.shrunk { flex: 0 0 auto; }
  /* A dragged tab follows the pointer; the others slide aside to show where it lands. */
  .tab.dragging { position: relative; z-index: 1; opacity: 0.9; box-shadow: 0 0 6px rgba(0, 0, 0, 0.6); }
  /* A dragged tab shrinks to about a pinned tab's size, so wide tabs are easy to place. */
  body:not(.vertical) .tab.dragging { flex: 0 0 auto; width: 10ch; min-width: 0; max-width: none; }
  .tab.shifting { transition: transform 120ms ease; }
  .tab.selected {
    font: var(--rt-font-tabs-selected, var(--font));
    background: var(--selected-bg);
    color: var(--selected-fg);
    box-shadow: inset 0 -2px 0 var(--selected-accent);
  }
  .indicator { width: var(--indicator-width, 3px); align-self: stretch; flex-shrink: 0; }
  .loading .indicator { background: var(--indicator-loading); }
  .error .indicator { background: var(--indicator-error); }
  .icon { width: 16px; height: 16px; flex-shrink: 0; }
  .title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: var(--title-align, left); }
  /* tabs.position left or right: one tab per row, scrolling when they don't fit. */
  .vertical #tabs { flex-direction: column; overflow-y: auto; scrollbar-width: none; }
  .vertical .tab { flex: 0 0 auto; padding: 1px 4px 1px 0; }
  /* The left edge holds the loading indicator, so the accent goes on the right. */
  .vertical .tab.selected { box-shadow: inset -3px 0 0 var(--selected-accent); }
</style>
</head>
<body>
<div id="tabs"></div>
<script>
  const bar = document.getElementById("tabs");
  const send = (name, data) => rt.send(name, JSON.stringify(data));

  // Drag to reorder with plain pointer events: press on a tab, move a few
  // pixels, and it follows the pointer while the others make room. (HTML5
  // drag and drop would involve the OS and let tabs leave the browser.)
  const DRAG_THRESHOLD = 5;
  let press = null;
  // A render that arrived mid-drag, shown once the tab is dropped.
  let deferred = null;
  const tabIndexAt = (x, y) => {
    const el = document.elementFromPoint(x, y)?.closest(".tab");
    return el ? Number(el.dataset.index) : null;
  };
  const vertical = () => document.body.classList.contains("vertical");
  const span = (rect) => (vertical() ? { start: rect.top, size: rect.height } : { start: rect.left, size: rect.width });

  function startDrag() {
    press.dragging = true;
    press.target = press.index;
    // Shrink first, then measure, so the other tabs' new sizes are what we compare with.
    bar.children[press.index].classList.add("dragging");
    press.spans = [...bar.children].map((el) => span(el.getBoundingClientRect()));
    for (const [i, el] of [...bar.children].entries()) if (i !== press.index) el.classList.add("shifting");
  }

  // Keep the dragged tab centred on the pointer and slide the others out of
  // its way. Where it lands follows the pointer, so a tab can pass narrow
  // ones near the edge of the bar.
  function dragTo(pointer) {
    const { index, spans } = press;
    const delta = pointer - spans[index].size / 2 - spans[index].start;
    let target = index;
    spans.forEach((other, i) => {
      const middle = other.start + other.size / 2;
      if (i > index && pointer > middle) target = Math.max(target, i);
      if (i < index && pointer < middle) target = Math.min(target, i);
    });
    press.target = target;
    const axis = vertical() ? "Y" : "X";
    [...bar.children].forEach((el, i) => {
      let shift = 0;
      if (i === index) shift = delta;
      else if (i > index && i <= target) shift = -spans[index].size;
      else if (i < index && i >= target) shift = spans[index].size;
      el.style.transform = shift ? `translate${axis}(${shift}px)` : "";
    });
  }

  function endDrag() {
    for (const el of bar.children) {
      el.classList.remove("dragging", "shifting");
      el.style.transform = "";
    }
    if (deferred) {
      const payload = deferred;
      deferred = null;
      window.rtRender(payload);
    }
  }

  bar.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    const index = tabIndexAt(e.clientX, e.clientY);
    if (index === null) return;
    press = { index, x: e.clientX, y: e.clientY, dragging: false };
    // Synthetic events (tests) have no pointer to capture.
    try { bar.setPointerCapture(e.pointerId); } catch {}
  });
  bar.addEventListener("pointermove", (e) => {
    if (!press) return;
    const moved = Math.max(Math.abs(e.clientX - press.x), Math.abs(e.clientY - press.y));
    if (!press.dragging && moved < DRAG_THRESHOLD) return;
    if (!press.dragging) startDrag();
    dragTo(vertical() ? e.clientY : e.clientX);
  });
  bar.addEventListener("pointerup", () => {
    if (!press) return;
    const { index, dragging, target } = press;
    press = null;
    if (!dragging) send("select-tab", { index });
    else if (target !== index) send("move-tab", { from: index, to: target });
    if (dragging) endDrag();
  });
  bar.addEventListener("pointercancel", () => {
    const dragging = press?.dragging;
    press = null;
    if (dragging) endDrag();
  });

  // tabs.close_mouse_button on the empty part of the bar: tabs.close_mouse_button_on_bar.
  let barButton = 1;
  bar.addEventListener("mousedown", (e) => { if (e.button === barButton && !e.target.closest(".tab")) e.preventDefault(); });
  bar.addEventListener("auxclick", (e) => { if (e.button === barButton && !e.target.closest(".tab")) send("bar-click", {}); });

  // One wheel notch switches one tab, however finely the device scrolls.
  let wheelAt = 0;
  bar.addEventListener("wheel", (e) => {
    e.preventDefault();
    const now = Date.now();
    if (now - wheelAt < 120 || e.deltaY === 0) return;
    wheelAt = now;
    send("cycle-tab", { forward: e.deltaY > 0 });
  }, { passive: false });

  function tabElement(tab, i, current, shrink, tooltips, closeButton) {
    const el = document.createElement("div");
    el.className = "tab";
    if (i === current) el.classList.add("selected");
    if (tab.pinned) el.classList.add("pinned");
    if (tab.pinned && shrink) el.classList.add("shrunk");
    if (tab.loading) el.classList.add("loading");
    if (tab.error) el.classList.add("error");
    if (tooltips) el.title = tab.title ? `${tab.title}\n${tab.url}` : tab.url;

    const indicator = document.createElement("span");
    indicator.className = "indicator";
    el.append(indicator);
    if (tab.favicon) {
      const icon = document.createElement("img");
      icon.className = "icon";
      icon.src = tab.favicon;
      icon.alt = "";
      icon.draggable = false;
      el.append(icon);
    }
    const title = document.createElement("span");
    title.className = "title";
    // tabs.title.format (or format_pinned), filled in by the browser.
    title.textContent = tab.label;
    el.append(title);

    el.dataset.index = String(i);
    // Middle-click closes, like most browsers.
    // tabs.close_mouse_button: middle (1), right (2) or none.
    const close = { middle: 1, right: 2 }[closeButton];
    el.addEventListener("mousedown", (e) => { if (e.button === close) e.preventDefault(); });
    el.addEventListener("auxclick", (e) => { if (e.button === close) send("close-tab", { index: i }); });
    if (close === 2) el.addEventListener("contextmenu", (e) => e.preventDefault());

    return el;
  }


  // ui.css from the config directory, after the page's own styles.
  let appliedCss = null;
  function applyCss(css) {
    if (css === undefined || css === appliedCss) return;
    appliedCss = css;
    let style = document.getElementById("user-css");
    if (!style) {
      style = document.createElement("style");
      style.id = "user-css";
      document.head.append(style);
    }
    style.textContent = css;
  }

  // ui.theme and colors.*: the browser sends them as --rt-<token> variables.
  let appliedTheme = "";
  function applyTheme(theme) {
    if (!theme) return;
    const key = JSON.stringify(theme);
    if (key === appliedTheme) return;
    appliedTheme = key;
    for (const [token, color] of Object.entries(theme)) {
      document.documentElement.style.setProperty(`--rt-${token}`, color);
    }
  }

  window.rtRender = (payload) => {
    applyTheme(payload.theme);
    applyCss(payload.css);
    // Replacing the tabs mid-drag would drop the one being dragged.
    if (press?.dragging) {
      deferred = payload;
      return;
    }
    const { tabs, current, shrink, vertical, tooltips, alignment, min_width, max_width, indicator_width, close_button, selected_accent } = payload;
    barButton = { middle: 1, right: 2 }[close_button];
    document.body.classList.toggle("vertical", vertical);
    const root = document.documentElement.style;
    root.setProperty("--title-align", alignment || "left");
    root.setProperty("--indicator-width", `${indicator_width ?? 3}px`);
    // An invalid color is ignored by setProperty, leaving the default.
    root.setProperty("--selected-accent", selected_accent || "var(--selected-bg)");
    root.setProperty("--tab-min-width", !vertical && min_width >= 0 ? `${min_width}px` : "0");
    root.setProperty("--tab-max-width", !vertical && max_width >= 0 ? `${max_width}px` : "none");
    // Shrinking pinned tabs saves width, which a vertical bar doesn't need.
    const shrinkPinned = shrink && !vertical;
    bar.replaceChildren(...tabs.map((tab, i) => tabElement(tab, i, current, shrinkPinned, tooltips, close_button)));
    bar.children[current]?.scrollIntoView({ block: "nearest", inline: "nearest" });
  };
</script>
</body>
</html>
