<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--rt-completion-bg, #0b2a3f);
    --fg: var(--rt-completion-fg, #e9f7f6);
    --header-bg: var(--rt-completion-category-bg, #061826);
    --header-fg: var(--rt-completion-category-fg, #e9f7f6);
    --desc-fg: var(--rt-completion-description-fg, #8fb3c4);
    --selected-bg: var(--rt-completion-selected-bg, #2ec4b6);
    --selected-fg: var(--rt-completion-selected-fg, #061826);
    --keyhint-fg: var(--rt-keyhint-fg, #2ec4b6);
    --match-fg: var(--rt-completion-match-fg, #d9b44a);
    --error-bg: var(--rt-messages-error-bg, #b8323f);
    --error-fg: var(--rt-messages-error-fg, #e9f7f6);
    --warning-bg: var(--rt-messages-warning-bg, #a8651a);
    --warning-fg: var(--rt-messages-warning-fg, #e9f7f6);
    --prompt-bg: var(--rt-prompts-bg, #0b2a3f);
    --prompt-fg: var(--rt-prompts-fg, #e9f7f6);
    --row-height: 18px;
    --font: var(--rt-font-completion-entry, 10pt "DejaVu Sans Mono", "Monospace", monospace);
    --font-category: var(--rt-font-completion-category, bold 10pt "DejaVu Sans Mono", "Monospace", monospace);
    --font-prompt: var(--rt-font-prompts, 10pt "DejaVu Sans Mono", "Monospace", monospace);
    --font-keyhint: var(--rt-font-keyhint, 10pt "DejaVu Sans Mono", "Monospace", monospace);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: var(--font);
    user-select: none;
    cursor: default;
  }
  .header, .row {
    display: flex;
    height: var(--row-height);
    line-height: var(--row-height);
    padding: 0 4px;
    white-space: pre;
  }
  .header { background: var(--header-bg); color: var(--header-fg); font: var(--font-category); }
  .keyhints { display: grid; grid-auto-flow: column; grid-auto-columns: 40ch; }
  .keyhint { font: var(--font-keyhint); height: var(--row-height); line-height: var(--row-height); padding: 0 4px; overflow: hidden; white-space: pre; text-overflow: ellipsis; }
  .keyhint .rest { margin-right: 1ch; }
  .keyhint .typed { color: var(--desc-fg); }
  .keyhint .rest { color: var(--keyhint-fg); font-weight: bold; }
  .message { background: var(--header-bg); color: var(--header-fg); overflow: hidden; text-overflow: ellipsis; white-space: pre; }
  .message.error { background: var(--error-bg); color: var(--error-fg); }
  .message.warning { background: var(--warning-bg); color: var(--warning-fg); }
  .row.selected { background: var(--selected-bg); color: var(--selected-fg); }
  .row.selected .desc { color: var(--selected-fg); }
  .match { color: var(--match-fg); font-weight: bold; }
  .row.selected .match { color: inherit; text-decoration: underline; }
  .name { width: 50%; max-width: 70ch; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; padding-right: 2ch; box-sizing: border-box; }
  .desc { flex: 1 1 auto; min-width: 0; color: var(--desc-fg); overflow: hidden; text-overflow: ellipsis; }
  .time, .detail { flex-shrink: 0; padding-left: 2ch; color: var(--desc-fg); }
  .detail { max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  .row.selected .time, .row.selected .detail { color: var(--selected-fg); }
  .prompt-message {
    padding: 0 4px;
    line-height: var(--row-height);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: calc(var(--row-height) * 8);
    overflow: hidden;
  }
  .prompt-input { padding: 0 4px; height: var(--row-height); line-height: var(--row-height); white-space: pre; background: var(--header-bg); }
  .prompt-hint { padding: 0 4px; height: var(--row-height); line-height: var(--row-height); color: var(--desc-fg); }
  .cursor { background: var(--fg); color: var(--bg); }
  .prompt-message, .prompt-input, .prompt-hint { font: var(--font-prompt); }
  /* A floating prompt: the overlay view is the box, so frame it and pad it.
     Amber marks it as a question without shouting. */
  :root { --prompt-accent: var(--rt-prompts-border, #d9b44a); --prompt-key-bg: var(--rt-prompts-key-bg, #3a3420); }
  body.floating {
    box-sizing: border-box;
    padding: 11px;
    background: var(--prompt-bg);
    color: var(--prompt-fg);
    border: 1px solid var(--prompt-accent);
    border-left-width: 4px;
    padding-left: 8px;
  }
  body.floating .header { display: block; overflow: hidden; text-overflow: ellipsis; background: none; color: var(--prompt-accent); }
  body.floating .prompt-input { margin: 2px 0; }
  /* ui.overlay.position = floating: a framed box with the command on top. */
  body.palette {
    box-sizing: border-box;
    padding: 4px;
    border: 1px solid var(--selected-bg);
  }
  .command-input { padding: 0 4px; height: var(--row-height); line-height: var(--row-height); white-space: pre; background: var(--header-bg); font: var(--font-prompt); }
  .prompt-site { font: var(--font-prompt); font-size: 1.45em; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .prompt-site .scheme { opacity: .6; font-weight: normal; }
  .prompt-asks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 4px; min-height: calc(var(--row-height) * 1.6); font: var(--font-prompt); }
  .prompt-asks .wants { opacity: .75; }
  .ask { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; background: var(--prompt-key-bg); color: var(--prompt-accent); font-weight: bold; }
  .ask svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .prompt-always { margin-top: 4px; padding: 0 4px; font: var(--font-prompt); font-size: .85em; opacity: .7; line-height: var(--row-height); }
  /* Docked: the site and its asks on one line. */
  body:not(.floating) .prompt-site { display: inline; font-size: 1em; }
  body:not(.floating) .prompt-asks { display: inline-flex; min-height: 0; padding: 0 0 0 6px; }
  .prompt-options { margin-top: 8px; display: flex; flex-direction: column; }
  .prompt-option {
    all: unset;
    display: flex;
    align-items: center;
    gap: 1ch;
    height: 22px;
    padding: 0 4px;
    font: var(--font-prompt);
    color: var(--prompt-fg);
    cursor: pointer;
  }
  .prompt-option:hover { background: var(--prompt-key-bg); }
  .prompt-option kbd {
    font: var(--font-prompt);
    min-width: 6ch;
    padding: 0 4px;
    border-radius: 3px;
    background: var(--prompt-key-bg);
    color: var(--prompt-accent);
    text-align: center;
  }
</style>
</head>
<body>
<div id="list"></div>
<script>
  function div(className, text) {
    const el = document.createElement("div");
    el.className = className;
    if (text != null) el.textContent = text;
    return el;
  }

  // Icons for what a site asks for, drawn with the text color.
  const ASK_ICONS = {
    camera: '<rect x="2" y="7" width="14" height="10" rx="2"/><path d="M16 11l6-3v8l-6-3z"/>',
    microphone: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    location: '<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    notifications: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    screen: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    clipboard: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/>',
    pointer: '<path d="M5 3l14 7-6 2-2 6z"/>',
    keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 14h10"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 19h14"/>',
    files: '<path d="M4 4h6l2 2h8v14H4z"/>',
    other: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h0"/>',
  };
  function askChip(ask) {
    const chip = div("ask");
    chip.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ASK_ICONS[ask.icon] || ASK_ICONS.other}</svg>`;
    chip.append(ask.name);
    return chip;
  }
  // The asking site, with its host in bold: a look-alike name stands out.
  function siteLine(site) {
    const line = div("prompt-site");
    const [scheme, rest] = site.includes("://") ? site.split("://") : ["", site];
    if (scheme) line.append(Object.assign(document.createElement("span"), { className: "scheme", textContent: `${scheme}://` }));
    line.append(Object.assign(document.createElement("b"), { textContent: rest }));
    return line;
  }

  function renderPrompt(list, p, floating) {
    const title = p.queued ? `${p.title}  (${p.queued} more waiting)` : p.title;
    const parts = [div("header", title)];
    if (p.site) {
      const wants = div("prompt-asks");
      wants.append(div("wants", "wants to use"), ...p.asks.map(askChip));
      parts.push(siteLine(p.site), wants);
    } else {
      parts.push(div("prompt-message", p.message));
    }
    if (p.kind === "text") {
      const input = div("prompt-input");
      const chars = Array.from(p.input);
      const caret = document.createElement("span");
      caret.className = "cursor";
      caret.textContent = chars[p.cursor] ?? " ";
      input.append(chars.slice(0, p.cursor).join(""), caret, chars.slice(p.cursor + 1).join(""));
      parts.push(input);
    }
    if (floating) {
      // One button per option; a click presses its key.
      const options = div("prompt-options", "");
      for (const option of p.options) {
        const button = document.createElement("button");
        button.className = "prompt-option";
        const keys = document.createElement("kbd");
        keys.textContent = option.keys;
        button.append(keys, option.label);
        button.addEventListener("mousedown", (e) => e.preventDefault());
        button.addEventListener("click", () => rt.send("prompt-key", JSON.stringify({ key: option.key })));
        options.append(button);
      }
      parts.push(options);
      if (p.always) parts.push(div("prompt-always", p.always));
    } else {
      parts.push(div("prompt-hint", p.hint));
    }
    list.replaceChildren(...parts);
  }

  // Either {kind: "prompt", prompt} or {kind: "rows", rows}, where rows are
  // The key hint popup: a header, then columns filled top to bottom. Each
  // entry shows the keys typed so far, the keys that complete it, and its command.
  function renderKeyhints(list, { prefix, items, rows }) {
    const header = document.createElement("div");
    header.className = "header";
    header.textContent = "Keys";
    const grid = document.createElement("div");
    grid.className = "keyhints";
    grid.style.gridTemplateRows = `repeat(${rows}, var(--row-height))`;
    for (const { keys, command } of items) {
      const el = document.createElement("div");
      el.className = "keyhint";
      const typed = document.createElement("span");
      typed.className = "typed";
      typed.textContent = prefix;
      const rest = document.createElement("span");
      rest.className = "rest";
      rest.textContent = keys;
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = command;
      el.append(typed, rest, desc);
      grid.append(el);
    }
    list.replaceChildren(header, grid);
  }

  // The command being typed, with its cursor, for the floating overlay.
  function renderCommand({ text, cursor }) {
    const el = div("command-input");
    const chars = Array.from(text);
    const caret = document.createElement("span");
    caret.className = "cursor";
    caret.textContent = chars[cursor] ?? " ";
    el.append(chars.slice(0, cursor).join(""), caret, chars.slice(cursor + 1).join(""));
    return el;
  }

  // A subset of strftime for completion.timestamp_format, as in the status bar's clock.
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August",
    "September", "October", "November", "December"];
  const pad = (n) => String(n).padStart(2, "0");
  function strftime(format, d) {
    return format.replace(/%([HIMSpaAbBdmyY%])/g, (_, c) => ({
      H: pad(d.getHours()), I: pad(d.getHours() % 12 || 12), M: pad(d.getMinutes()),
      S: pad(d.getSeconds()), p: d.getHours() < 12 ? "AM" : "PM",
      a: DAYS[d.getDay()].slice(0, 3), A: DAYS[d.getDay()],
      b: MONTHS[d.getMonth()].slice(0, 3), B: MONTHS[d.getMonth()],
      d: pad(d.getDate()), m: pad(d.getMonth() + 1), y: pad(d.getFullYear() % 100),
      Y: String(d.getFullYear()), "%": "%",
    })[c]);
  }

  // Either {kind: "prompt", prompt}, {kind: "keyhints", …} or {kind: "rows", rows, timestamp_format, words},
  // where rows are {header}, {name, description, detail, time, selected}, or {message, level}
  // for messages older than the one in the status bar.

  // The height one line of text needs in `font`, at `lineHeight`.
  function lineBox(font, lineHeight) {
    const probe = document.createElement("span");
    probe.textContent = "Mg";
    probe.style.cssText = `position:absolute;visibility:hidden;white-space:pre;font:${font};line-height:${lineHeight}`;
    document.body.append(probe);
    const height = probe.getBoundingClientRect().height;
    probe.remove();
    return height;
  }
  // Tell the browser how big this page wants to be, when that changes, so
  // fonts, padding and ui.css change the real size instead of clipping.
  let reportedSize = "";
  function reportSize(size) {
    const json = JSON.stringify(size);
    if (json === reportedSize) return;
    reportedSize = json;
    rt.send("size", json);
  }

  // Rows grow with the completion fonts; the browser sizes the overlay by rows.
  function measure() {
    const root = getComputedStyle(document.documentElement);
    const fonts = ["--font", "--font-category", "--font-prompt", "--font-keyhint"].map((v) => root.getPropertyValue(v));
    const row = Math.max(18, ...fonts.map((f) => Math.ceil(lineBox(f, 1.35))));
    document.documentElement.style.setProperty("--row-height", `${row}px`);
    reportSize({ row_height: row });
  }

  // ui.css from the config directory, after the page's own styles.
  let appliedCss = null;
  function applyCss(css) {
    if (css === undefined || css === appliedCss) return;
    appliedCss = css;
    let style = document.getElementById("user-css");
    if (!style) {
      style = document.createElement("style");
      style.id = "user-css";
      document.head.append(style);
    }
    style.textContent = css;
  }

  // ui.theme and colors.*: the browser sends them as --rt-<token> variables.
  let appliedTheme = "";
  function applyTheme(theme) {
    if (!theme) return;
    const key = JSON.stringify(theme);
    if (key === appliedTheme) return;
    appliedTheme = key;
    for (const [token, color] of Object.entries(theme)) {
      document.documentElement.style.setProperty(`--rt-${token}`, color);
    }
  }

  // Fill `el` with `text`, the typed words (any case) marked as matches.
  function setMatched(el, text, words) {
    const lower = text.toLowerCase();
    const marked = new Array(text.length).fill(false);
    for (const word of words || []) {
      const w = word.toLowerCase();
      if (!w) continue;
      for (let i = lower.indexOf(w); i !== -1; i = lower.indexOf(w, i + w.length)) {
        marked.fill(true, i, i + w.length);
      }
    }
    // toLowerCase can change the length (e.g. İ); then don't mark anything.
    if (lower.length !== text.length) return void (el.textContent = text);
    const parts = [];
    for (let i = 0; i < text.length; ) {
      let j = i;
      while (j < text.length && marked[j] === marked[i]) j++;
      const chunk = text.slice(i, j);
      if (marked[i]) {
        const span = document.createElement("span");
        span.className = "match";
        span.textContent = chunk;
        parts.push(span);
      } else {
        parts.push(chunk);
      }
      i = j;
    }
    el.replaceChildren(...parts);
  }

  window.rtRender = (payload) => {
    applyTheme(payload.theme);
    applyCss(payload.css);
    measure();
    const list = document.getElementById("list");
    // prompt.position = bottom: a framed box floating over the page.
    document.body.classList.toggle("floating", payload.kind === "prompt" && !!payload.floating);
    // prompt-dialog, prompt-permission, prompt-login, prompt-download,
    // prompt-certificate or prompt-confirm, for ui.css.
    for (const c of [...document.body.classList]) if (c.startsWith("prompt-")) document.body.classList.remove(c);
    if (payload.kind === "prompt") document.body.classList.add(`prompt-${payload.prompt.topic}`);
    if (payload.kind === "prompt") return renderPrompt(list, payload.prompt, payload.floating);
    document.body.classList.toggle("palette", payload.kind !== "prompt" && !!payload.floating);
    if (payload.kind === "keyhints") return renderKeyhints(list, payload);
    const command = payload.command_line ? [renderCommand(payload.command_line)] : [];
    list.replaceChildren(...command, ...payload.rows.map((row) => {
      const el = document.createElement("div");
      if (row.header) {
        el.className = "header";
        el.textContent = row.header;
        return el;
      }
      if (row.message !== undefined) {
        el.className = `row message ${row.level}`;
        el.textContent = row.message;
        return el;
      }
      el.className = row.selected ? "row selected" : "row";
      const name = document.createElement("span");
      name.className = "name";
      setMatched(name, row.name, payload.words);
      const desc = document.createElement("span");
      desc.className = "desc";
      setMatched(desc, row.description, payload.words);
      el.append(name, desc);
      if (row.detail != null) {
        const detail = document.createElement("span");
        detail.className = "detail";
        detail.textContent = row.detail;
        el.append(detail);
      }
      if (row.time != null && payload.timestamp_format) {
        const time = document.createElement("span");
        time.className = "time";
        time.textContent = strftime(payload.timestamp_format, new Date(row.time * 1000));
        el.append(time);
      }
      return el;
    }));
  };
</script>
</body>
</html>
