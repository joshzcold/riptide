<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--rt-completion-bg, #0b2a3f);
    --fg: var(--rt-completion-fg, #e9f7f6);
    --header-bg: var(--rt-completion-category-bg, #061826);
    --header-fg: var(--rt-completion-category-fg, #e9f7f6);
    --desc-fg: var(--rt-completion-description-fg, #8fb3c4);
    --selected-bg: var(--rt-completion-selected-bg, #2ec4b6);
    --selected-fg: var(--rt-completion-selected-fg, #061826);
    --keyhint-fg: var(--rt-keyhint-fg, #2ec4b6);
    --error-bg: var(--rt-messages-error-bg, #b8323f);
    --error-fg: var(--rt-messages-error-fg, #e9f7f6);
    --warning-bg: var(--rt-messages-warning-bg, #a8651a);
    --warning-fg: var(--rt-messages-warning-fg, #e9f7f6);
    --prompt-bg: var(--rt-prompts-bg, #0b2a3f);
    --prompt-fg: var(--rt-prompts-fg, #e9f7f6);
    --row-height: 18px;
    --font: var(--rt-font-completion-entry, 10pt "DejaVu Sans Mono", "Monospace", monospace);
    --font-category: var(--rt-font-completion-category, bold 10pt "DejaVu Sans Mono", "Monospace", monospace);
    --font-prompt: var(--rt-font-prompts, 10pt "DejaVu Sans Mono", "Monospace", monospace);
    --font-keyhint: var(--rt-font-keyhint, 10pt "DejaVu Sans Mono", "Monospace", monospace);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: var(--font);
    user-select: none;
    cursor: default;
  }
  .header, .row {
    display: flex;
    height: var(--row-height);
    line-height: var(--row-height);
    padding: 0 4px;
    white-space: pre;
  }
  .header { background: var(--header-bg); color: var(--header-fg); font: var(--font-category); }
  .keyhints { display: grid; grid-auto-flow: column; grid-auto-columns: 40ch; }
  .keyhint { font: var(--font-keyhint); height: var(--row-height); line-height: var(--row-height); padding: 0 4px; overflow: hidden; white-space: pre; text-overflow: ellipsis; }
  .keyhint .rest { margin-right: 1ch; }
  .keyhint .typed { color: var(--desc-fg); }
  .keyhint .rest { color: var(--keyhint-fg); font-weight: bold; }
  .message { background: var(--header-bg); color: var(--header-fg); overflow: hidden; text-overflow: ellipsis; white-space: pre; }
  .message.error { background: var(--error-bg); color: var(--error-fg); }
  .message.warning { background: var(--warning-bg); color: var(--warning-fg); }
  .row.selected { background: var(--selected-bg); color: var(--selected-fg); }
  .row.selected .desc { color: var(--selected-fg); }
  .name { width: 50%; max-width: 70ch; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; padding-right: 2ch; box-sizing: border-box; }
  .desc { flex: 1 1 auto; min-width: 0; color: var(--desc-fg); overflow: hidden; text-overflow: ellipsis; }
  .time, .detail { flex-shrink: 0; padding-left: 2ch; color: var(--desc-fg); }
  .detail { max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  .row.selected .time, .row.selected .detail { color: var(--selected-fg); }
  .prompt-message {
    padding: 0 4px;
    line-height: var(--row-height);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: calc(var(--row-height) * 8);
    overflow: hidden;
  }
  .prompt-input { padding: 0 4px; height: var(--row-height); line-height: var(--row-height); white-space: pre; background: var(--header-bg); }
  .prompt-hint { padding: 0 4px; height: var(--row-height); line-height: var(--row-height); color: var(--desc-fg); }
  .cursor { background: var(--fg); color: var(--bg); }
  .prompt-message, .prompt-input, .prompt-hint { font: var(--font-prompt); }
  /* A floating prompt: the overlay view is the box, so frame it and pad it.
     Amber marks it as a question without shouting. */
  :root { --prompt-accent: var(--rt-prompts-border, #d9b44a); --prompt-key-bg: var(--rt-prompts-key-bg, #3a3420); }
  body.floating {
    box-sizing: border-box;
    padding: 11px;
    background: var(--prompt-bg);
    color: var(--prompt-fg);
    border: 1px solid var(--prompt-accent);
    border-left-width: 4px;
    padding-left: 8px;
  }
  body.floating .header { background: none; color: var(--prompt-accent); }
  body.floating .prompt-input { margin: 2px 0; }
  .prompt-options { margin-top: 8px; display: flex; flex-direction: column; }
  .prompt-option {
    all: unset;
    display: flex;
    align-items: center;
    gap: 1ch;
    height: 22px;
    padding: 0 4px;
    font: var(--font-prompt);
    color: var(--prompt-fg);
    cursor: pointer;
  }
  .prompt-option:hover { background: var(--prompt-key-bg); }
  .prompt-option kbd {
    font: var(--font-prompt);
    min-width: 6ch;
    padding: 0 4px;
    border-radius: 3px;
    background: var(--prompt-key-bg);
    color: var(--prompt-accent);
    text-align: center;
  }
</style>
</head>
<body>
<div id="list"></div>
<script>
  function div(className, text) {
    const el = document.createElement("div");
    el.className = className;
    if (text != null) el.textContent = text;
    return el;
  }

  function renderPrompt(list, p, floating) {
    const title = p.queued ? `${p.title}  (${p.queued} more waiting)` : p.title;
    const parts = [div("header", title), div("prompt-message", p.message)];
    if (p.kind === "text") {
      const input = div("prompt-input");
      const chars = Array.from(p.input);
      const caret = document.createElement("span");
      caret.className = "cursor";
      caret.textContent = chars[p.cursor] ?? " ";
      input.append(chars.slice(0, p.cursor).join(""), caret, chars.slice(p.cursor + 1).join(""));
      parts.push(input);
    }
    if (floating) {
      // One button per option; a click presses its key.
      const options = div("prompt-options", "");
      for (const option of p.options) {
        const button = document.createElement("button");
        button.className = "prompt-option";
        const keys = document.createElement("kbd");
        keys.textContent = option.keys;
        button.append(keys, option.label);
        button.addEventListener("mousedown", (e) => e.preventDefault());
        button.addEventListener("click", () => rt.send("prompt-key", JSON.stringify({ key: option.key })));
        options.append(button);
      }
      parts.push(options);
    } else {
      parts.push(div("prompt-hint", p.hint));
    }
    list.replaceChildren(...parts);
  }

  // Either {kind: "prompt", prompt} or {kind: "rows", rows}, where rows are
  // The key hint popup: a header, then columns filled top to bottom. Each
  // entry shows the keys typed so far, the keys that complete it, and its command.
  function renderKeyhints(list, { prefix, items, rows }) {
    const header = document.createElement("div");
    header.className = "header";
    header.textContent = "Keys";
    const grid = document.createElement("div");
    grid.className = "keyhints";
    grid.style.gridTemplateRows = `repeat(${rows}, var(--row-height))`;
    for (const { keys, command } of items) {
      const el = document.createElement("div");
      el.className = "keyhint";
      const typed = document.createElement("span");
      typed.className = "typed";
      typed.textContent = prefix;
      const rest = document.createElement("span");
      rest.className = "rest";
      rest.textContent = keys;
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = command;
      el.append(typed, rest, desc);
      grid.append(el);
    }
    list.replaceChildren(header, grid);
  }

  // A subset of strftime for completion.timestamp_format, as in the status bar's clock.
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August",
    "September", "October", "November", "December"];
  const pad = (n) => String(n).padStart(2, "0");
  function strftime(format, d) {
    return format.replace(/%([HIMSpaAbBdmyY%])/g, (_, c) => ({
      H: pad(d.getHours()), I: pad(d.getHours() % 12 || 12), M: pad(d.getMinutes()),
      S: pad(d.getSeconds()), p: d.getHours() < 12 ? "AM" : "PM",
      a: DAYS[d.getDay()].slice(0, 3), A: DAYS[d.getDay()],
      b: MONTHS[d.getMonth()].slice(0, 3), B: MONTHS[d.getMonth()],
      d: pad(d.getDate()), m: pad(d.getMonth() + 1), y: pad(d.getFullYear() % 100),
      Y: String(d.getFullYear()), "%": "%",
    })[c]);
  }

  // Either {kind: "prompt", prompt}, {kind: "keyhints", …} or {kind: "rows", rows, timestamp_format},
  // where rows are {header}, {name, description, detail, time, selected}, or {message, level}
  // for messages older than the one in the status bar.

  // ui.theme and colors.*: the browser sends them as --rt-<token> variables.
  let appliedTheme = "";
  function applyTheme(theme) {
    if (!theme) return;
    const key = JSON.stringify(theme);
    if (key === appliedTheme) return;
    appliedTheme = key;
    for (const [token, color] of Object.entries(theme)) {
      document.documentElement.style.setProperty(`--rt-${token}`, color);
    }
  }

  window.rtRender = (payload) => {
    applyTheme(payload.theme);
    const list = document.getElementById("list");
    // prompt.position = bottom: a framed box floating over the page.
    document.body.classList.toggle("floating", payload.kind === "prompt" && !!payload.floating);
    if (payload.kind === "prompt") return renderPrompt(list, payload.prompt, payload.floating);
    if (payload.kind === "keyhints") return renderKeyhints(list, payload);
    list.replaceChildren(...payload.rows.map((row) => {
      const el = document.createElement("div");
      if (row.header) {
        el.className = "header";
        el.textContent = row.header;
        return el;
      }
      if (row.message !== undefined) {
        el.className = `row message ${row.level}`;
        el.textContent = row.message;
        return el;
      }
      el.className = row.selected ? "row selected" : "row";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = row.name;
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = row.description;
      el.append(name, desc);
      if (row.detail != null) {
        const detail = document.createElement("span");
        detail.className = "detail";
        detail.textContent = row.detail;
        el.append(detail);
      }
      if (row.time != null && payload.timestamp_format) {
        const time = document.createElement("span");
        time.className = "time";
        time.textContent = strftime(payload.timestamp_format, new Date(row.time * 1000));
        el.append(time);
      }
      return el;
    }));
  };
</script>
</body>
</html>
