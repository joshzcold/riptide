<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--rt-completion-bg, #0b2a3f);
    --fg: var(--rt-completion-fg, #e9f7f6);
    --head-bg: var(--rt-completion-category-bg, #061826);
    --head-fg: var(--rt-completion-category-fg, #e9f7f6);
    --cursor-bg: var(--rt-completion-selected-bg, #2ec4b6);
    --cursor-fg: var(--rt-completion-selected-fg, #061826);
    --accent: var(--rt-prompts-border, #d9b44a);
    --key-bg: var(--rt-prompts-key-bg, #3a3420);
    --muted: var(--rt-completion-description-fg, #8fb3c4);
    --match: var(--rt-completion-match-fg, #d9b44a);
    --url: var(--rt-statusbar-https-fg, #2ec4b6);
    --info: var(--rt-statusbar-https-fg, #2ec4b6);
    --warning: var(--rt-messages-warning-bg, #a8651a);
    --error: var(--rt-messages-error-bg, #b8323f);
    --font: var(--rt-font-completion-entry, 10pt "DejaVu Sans Mono", "Monospace", monospace);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: var(--font); overflow: hidden; }
  body { display: flex; flex-direction: column; user-select: none; cursor: default; box-sizing: border-box; border: 1px solid transparent; }
  body.focused { border-color: var(--accent); }
  #head { display: flex; gap: 1ch; justify-content: space-between; background: var(--head-bg); color: var(--head-fg); padding: 0 .5rem; line-height: 1.6; font-weight: bold; }
  #source { color: var(--muted); font-weight: normal; font-size: .85em; }
  #lines { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .line { white-space: pre; overflow: hidden; text-overflow: ellipsis; padding: 0 .5rem; line-height: 1.5; min-height: 1.5em; }
  body.focused .line.cursor { background: var(--cursor-bg); color: var(--cursor-fg); }
  body.focused .line.cursor span { color: inherit; }
  body.keys .line.cursor { box-shadow: inset 2px 0 0 var(--accent); }
  .hl-title { color: var(--accent); font-weight: bold; }
  .hl-muted { color: var(--muted); }
  .hl-accent { color: var(--accent); }
  .hl-match { color: var(--match); font-weight: bold; }
  .hl-url { color: var(--url); }
  .hl-info { color: var(--info); }
  .hl-warning { color: var(--warning); font-weight: bold; }
  .hl-error { color: var(--error); font-weight: bold; }
  .hl-key { background: var(--key-bg); color: var(--accent); padding: 0 .35rem; border-radius: 3px; }
  #lines::-webkit-scrollbar { width: 6px; }
  #lines::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
</style>
</head>
<body>
<div id="head"><span id="title"></span><span id="source"></span></div>
<div id="lines"></div>
<script>
  addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false, capture: true });
  const $ = (id) => document.getElementById(id);
  let panelId = 0;

  let appliedCss = null;
  function applyCss(css) {
    if (css === undefined || css === appliedCss) return;
    appliedCss = css;
    let style = $("user-css");
    if (!style) {
      style = document.createElement("style");
      style.id = "user-css";
      document.head.append(style);
    }
    style.textContent = css;
  }

  function applyTheme(theme) {
    for (const [token, color] of Object.entries(theme || {})) {
      document.documentElement.style.setProperty(`--rt-${token}`, color);
    }
  }

  // Text only: chunks become spans with textContent, never HTML.
  function line(chunks, index, cursor) {
    const div = document.createElement("div");
    div.className = index + 1 === cursor ? "line cursor" : "line";
    div.addEventListener("click", () => rt.send("click", JSON.stringify({ id: panelId, line: index + 1 })));
    for (const [text, group] of chunks) {
      const span = document.createElement("span");
      if (group) span.className = `hl-${group}`;
      span.textContent = text;
      div.append(span);
    }
    return div;
  }

  window.rtPanel = (state) => {
    panelId = state.id;
    applyTheme(state.theme);
    applyCss(state.css);
    document.body.classList.toggle("focused", state.focused);
    document.body.classList.toggle("keys", state.keys);
    $("title").textContent = state.title;
    // A plugin's panel says whose it is.
    $("source").textContent = state.source ? `plugin ${state.source}` : "";
    $("head").style.display = state.title || state.source ? "" : "none";
    $("lines").replaceChildren(...state.lines.map((chunks, i) => line(chunks, i, state.cursor)));
    document.querySelector(".line.cursor")?.scrollIntoView({ block: "nearest" });
  };
</script>
</body>
</html>
