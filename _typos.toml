# typos (scripts/tool.sh typos): spelling in code, docs and commit messages.
# These words are right where they are: partial command names and URLs typed
# in tests, hint labels, the misspelling the spell checker is tested with, and
# language codes (fo-FO is Faroese), and the cef crate's display_get_alls.
[default.extend-words]
alls = "alls"
ba = "ba"
fo = "fo"
mispeled = "mispeled"
oll = "oll"
onl = "onl"
paragrap = "paragrap"
secon = "secon"
sentance = "sentance"
teh = "teh"

[files]
extend-exclude = ["CHANGELOG.md", "*.png", "*.svg", "crates/rt-e2e/pages/blank.pdf", "crates/rt-adblock/resources/ubo.json"]
