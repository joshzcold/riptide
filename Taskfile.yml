# https://taskfile.dev
version: '3'

vars:
  # Read from Cargo.lock so the downloaded CEF always matches the pinned `cef` crate.
  CEF_CRATE_VERSION:
    sh: awk '/^name = "cef"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock
  CEF_BUILD:
    sh: echo "{{.CEF_CRATE_VERSION}}" | cut -d+ -f2
  CEF_RS_DIR: target/cef-rs-{{.CEF_CRATE_VERSION}}

env:
  CEF_PATH:
    sh: echo "${CEF_PATH:-$HOME/.local/share/cef}"

tasks:
  default:
    silent: true
    cmds:
      - "{{.TASK_EXE}} --list"

  setup:
    desc: Download the CEF binaries that match the pinned cef crate into $CEF_PATH
    status:
      - grep -q "cef_binary_{{.CEF_BUILD}}+" "$CEF_PATH/archive.json"
    cmds:
      - rm -rf "{{.CEF_RS_DIR}}"
      - git clone --depth 1 --branch "cef-v{{.CEF_CRATE_VERSION}}" https://github.com/tauri-apps/cef-rs "{{.CEF_RS_DIR}}"
      - cd "{{.CEF_RS_DIR}}" && cargo run -q -p export-cef-dir -- --force "$CEF_PATH"

  build:
    desc: Debug build
    deps: [setup]
    cmds:
      - cargo build

  release:
    desc: Optimized build
    deps: [setup]
    cmds:
      - cargo build --release

  package:
    desc: Release build packed with its CEF runtime into dist/ (Linux)
    deps: [release]
    cmds:
      - scripts/package-linux.sh

  appimage:
    desc: Release build as a tarball and an AppImage in dist/ (Linux)
    deps: [release]
    cmds:
      - scripts/package-linux.sh --appimage

  changelog:
    desc: 'Regenerate CHANGELOG.md; for a release: task changelog -- --tag v0.2.0'
    cmds:
      - scripts/git-cliff.sh -o CHANGELOG.md {{.CLI_ARGS}}

  docs:
    desc: Build the documentation website into docs/book/book/
    cmds:
      - scripts/mdbook.sh build docs/book

  docs-serve:
    desc: Serve the documentation website at http://localhost:3000, rebuilding on save
    cmds:
      - scripts/mdbook.sh serve docs/book {{.CLI_ARGS}}

  run:
    desc: 'Run the browser; pass a URL after --, e.g. task run -- example.com'
    deps: [setup]
    cmds:
      - cargo run --bin riptide -- {{.CLI_ARGS}}

  test:
    desc: Unit tests (everything except the CEF layer)
    cmds:
      - cargo test --no-fail-fast -p rt-core -p rt-config -p rt-storage -p rt-adblock

  smoke:
    desc: Drive the real browser on a throwaway X display (needs Xvfb and xdotool)
    deps: [build]
    cmds:
      - ./scripts/smoke-test.sh

  e2e:
    desc: 'End-to-end tests: real browsers on throwaway X displays, driven through the test channel (needs Xvfb); pass a test name after --'
    deps: [build]
    cmds:
      - cargo test -p rt-e2e --no-fail-fast -- --ignored --test-threads={{.E2E_THREADS | default "2"}} {{.CLI_ARGS}}

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt

  lint:
    desc: Formatting, clippy, ShellCheck, actionlint and cargo-deny (licenses, advisories, sources)
    deps: [setup]
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - scripts/tool.sh shellcheck scripts/*.sh task
      - scripts/tool.sh actionlint
      - scripts/tool.sh cargo-deny check --hide-inclusion-graph

  check:
    desc: Everything CI would run - lint, unit tests, e2e tests, smoke test
    cmds:
      - task: lint
      - task: test
      - task: e2e
      - task: smoke

  hooks:
    desc: Install a git hook that checks commit messages (Conventional Commits)
    cmds:
      - printf '#!/bin/sh\nexec scripts/check-commits.sh --file "$1"\n' > .git/hooks/commit-msg
      - chmod +x .git/hooks/commit-msg

  clean:
    desc: Remove build output (keeps the shared CEF binaries)
    cmds:
      - cargo clean
