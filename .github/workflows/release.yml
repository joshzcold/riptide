name: release

# Releases go through pull requests, since main only takes changes that way:
#   1. Actions → release → Run workflow works out the version (the one you
#      type, or git-cliff's next version from the Conventional Commits since
#      the last tag; feat bumps the minor version in 0.x), commits
#      `chore(release): vX.Y.Z` with Cargo.toml, Cargo.lock and CHANGELOG.md
#      to a release/vX.Y.Z branch, and opens a pull request for it.
#   2. Merging that pull request is the release: on the push to main, a
#      Cargo.toml version with no tag yet is built (build-release.yml: the
#      Linux tarball, AppImage and .deb, smoke-tested, plus experimental macOS
#      and Windows packages), tagged and published with SHA256SUMS, build
#      provenance and the changelog section.
#   3. A second pull request points the AUR and Nix packages at the new
#      tarball (not for pre-releases).
# "Dry run" (the default) builds and packages without pushing anything, and
# keeps the files as a workflow artifact for a day.
#
# If Actions isn't allowed to create pull requests (Settings → Actions →
# "Allow GitHub Actions to create and approve pull requests"), the run's
# summary links to open each one by hand instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2.0 (empty = work it out from the commits)
        type: string
        required: false
      dry_run:
        description: Dry run (build only, don't push or publish)
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.ref }}
          fetch-depth: 0
      - name: Plan the release
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)

          if [[ $GITHUB_EVENT_NAME == push ]]; then
            # Every push to main lands here; only a version without a tag (a
            # merged release pull request) is released.
            if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
              echo "v$current is already released; nothing to do"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Releasing v$current from $GITHUB_SHA"
            { echo "build=true"; echo "version=$current"; echo "ref=$GITHUB_SHA"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ $DRY_RUN != true && $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::releases are cut from main; this run is on $GITHUB_REF_NAME (a dry run works anywhere)"
            exit 1
          fi

          version=${INPUT_VERSION#v}
          if [[ -z $version ]]; then
            version=$(scripts/git-cliff.sh --bumped-version 2>/dev/null)
            version=${version#v}
          fi
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' isn't a version like 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
          echo "Preparing v$version (Cargo.toml has $current)"

          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          cargo update --workspace --quiet
          scripts/git-cliff.sh --tag "v$version" -o CHANGELOG.md 2>/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore(release): v$version"
          git show --stat HEAD

          if [[ $DRY_RUN == true ]]; then
            # Nothing is pushed, so the build uses the branch as it was, with the new version in the file names.
            { echo "build=true"; echo "version=$version"; echo "ref=$(git rev-parse HEAD~1)"; echo "publish=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch=release/v$version
          git push -q origin "HEAD:refs/heads/$branch"
          scripts/open-pr.sh "$branch" "chore(release): v$version" \
            "Merging this releases **v$version**: the push to main builds, tags and publishes it. The version and \`CHANGELOG.md\` were updated by the release workflow."
          echo "build=false" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    name: publish
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REF: ${{ needs.plan.outputs.ref }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          # The tag doesn't exist until the release is created, so the
          # unreleased commits are rendered as if tagged.
          scripts/git-cliff.sh --unreleased --tag "v$VERSION" --strip header 2>/dev/null > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads

          - **Linux (x86_64):** the `.deb` for Ubuntu 24.04+ and Debian 13+ (`sudo apt install ./riptide_*.deb`), the `.AppImage`, or the `.tar.gz` (unpack and run `riptide`). See [Installing](https://joshzcold.github.io/riptide/guide/installing.html) for the sandbox setup.
          - **macOS and Windows:** experimental packages that don't run the browser yet.
          - Check a download with `sha256sum -c SHA256SUMS --ignore-missing`, or its build provenance with `gh attestation verify <file> --repo joshzcold/riptide`.
          EOF
      - name: Build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ $VERSION == *-* ]] && flags+=(--prerelease)
          # Creates the tag on the merged release commit.
          gh release create "v$VERSION" --target "$REF" --title "riptide v$VERSION" \
            --notes-file notes.md "${flags[@]}" dist/*
      # The AUR and Nix packages download the release tarball, so a pull
      # request points them at the new version. A dry run shows the change.
      - name: Update the AUR and Nix packages
        if: ${{ !contains(needs.plan.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $PUBLISH == true ]]; then
            git fetch -q origin main
            git checkout -q -B "release/v$VERSION-packages" origin/main
          fi
          scripts/update-packages.sh "$VERSION" "dist/riptide-$VERSION-linux-x86_64.tar.gz"
          git diff -- packaging
          if [[ $PUBLISH != true ]] || git diff --quiet -- packaging; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(release): update the AUR and Nix packages for v$VERSION" -- packaging
          git push -q origin "HEAD:refs/heads/release/v$VERSION-packages"
          scripts/open-pr.sh "release/v$VERSION-packages" \
            "chore(release): update the AUR and Nix packages for v$VERSION" \
            "Points \`packaging/aur/PKGBUILD\` and \`packaging/nix/package.nix\` (and so the flake) at the v$VERSION tarball."
      - name: Keep the files (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-dry-run
          path: |
            dist/
            notes.md
          retention-days: 1
