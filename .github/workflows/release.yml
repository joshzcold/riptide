name: release

# Releases go through pull requests, since main only takes changes that way:
#   1. Every push to main with changelog-worthy commits since the last tag
#      rebuilds one standing pull request from the release/next branch:
#      `chore(release): vX.Y.Z` with Cargo.toml, Cargo.lock and CHANGELOG.md,
#      where X.Y.Z is git-cliff's next version from the Conventional Commits
#      (feat bumps the minor version in 0.x, fix the patch version).
#      Actions → release → Run workflow does the same on demand, and can take
#      a version to use instead (until main next changes).
#   2. Merging that pull request is the release: on the push to main, a
#      Cargo.toml version with no tag yet is built (build-release.yml: the
#      Linux tarball, AppImage and .deb, smoke-tested, plus macOS and
#      Windows packages), tagged and published with SHA256SUMS, build
#      provenance and the changelog section.
#   3. A second pull request points the AUR and Nix packages at the new
#      tarball (not for pre-releases).
# "Dry run" (the default) builds and packages without pushing anything, and
# keeps the files as a workflow artifact for a day.
#
# If Actions isn't allowed to create pull requests (Settings → Actions →
# "Allow GitHub Actions to create and approve pull requests"), the run's
# summary links to open each one by hand instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2.0 (empty = work it out from the commits)
        type: string
        required: false
      dry_run:
        description: Dry run (build only, don't push or publish)
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.ref }}
          fetch-depth: 0
      - name: Plan the release
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
        run: |
          current=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)

          branch=release/next
          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')

          if [[ $GITHUB_EVENT_NAME == push ]]; then
            # A version without a tag is a merged release pull request: release it.
            if ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
              echo "Releasing v$current from $GITHUB_SHA"
              { echo "build=true"; echo "version=$current"; echo "ref=$GITHUB_SHA"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Otherwise keep the release pull request up to date with main, or
            # close it when nothing since the last tag would be in the changelog.
            releasable=$(scripts/git-cliff.sh --unreleased --context 2>/dev/null | jq '[.[].commits[]] | length')
            if (( releasable == 0 )); then
              echo "Nothing to release since v$current"
              echo "build=false" >> "$GITHUB_OUTPUT"
              if [[ -n $open_pr ]]; then
                gh pr close "$open_pr" --delete-branch --comment "Nothing since v$current would be in the changelog any more."
              fi
              exit 0
            fi
            DRY_RUN=false
          elif [[ $DRY_RUN != true && $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::releases are cut from main; this run is on $GITHUB_REF_NAME (a dry run works anywhere)"
            exit 1
          fi

          version=${INPUT_VERSION#v}
          if [[ -z $version ]]; then
            version=$(scripts/git-cliff.sh --bumped-version 2>/dev/null)
            version=${version#v}
          fi
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' isn't a version like 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
          echo "Preparing v$version (Cargo.toml has $current)"

          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          cargo update --workspace --quiet
          scripts/git-cliff.sh --tag "v$version" -o CHANGELOG.md 2>/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore(release): v$version"
          git show --stat HEAD

          if [[ $DRY_RUN == true ]]; then
            # Nothing is pushed, so the build uses the branch as it was, with the new version in the file names.
            { echo "build=true"; echo "version=$version"; echo "ref=$(git rev-parse HEAD~1)"; echo "publish=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One standing pull request, rebuilt from main each time it changes.
          git push -q --force origin "HEAD:refs/heads/$branch"
          title="chore(release): v$version"
          body="Merging this releases **v$version**: the push to main builds, tags and publishes it. The release workflow keeps this pull request up to date with main, so change the notes through commit messages or \`cliff.toml\`, not here.

          $(scripts/git-cliff.sh --unreleased --tag "v$version" --strip header 2>/dev/null)"
          if [[ -n $open_pr ]]; then
            old_title=$(gh pr view "$open_pr" --json title --jq .title)
            gh pr edit "$open_pr" --title "$title" --body "$body"
            echo "Updated #$open_pr: $title" >> "$GITHUB_STEP_SUMMARY"
          else
            scripts/open-pr.sh "$branch" "$title" "$body"
          fi
          # A new release pull request or a new version is news; another commit in it isn't.
          if [[ -z $open_pr || $old_title != "$title" ]]; then
            url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
            scripts/notify.sh "riptide v$version is ready to release" \
              "$(scripts/git-cliff.sh --unreleased --tag "v$version" --strip all 2>/dev/null | head -c 3000)" \
              "${url:-https://github.com/$GITHUB_REPOSITORY/pulls}" package
          fi
          echo "build=false" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    name: publish
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REF: ${{ needs.plan.outputs.ref }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          # The tag doesn't exist until the release is created, so the
          # unreleased commits are rendered as if tagged.
          scripts/git-cliff.sh --unreleased --tag "v$VERSION" --strip header 2>/dev/null > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads

          - **Linux (x86_64):** the `.deb` for Ubuntu 24.04+ and Debian 13+ (`sudo apt install ./riptide_*.deb`), the `.AppImage`, or the `.tar.gz` (unpack and run `riptide`). See [Installing](https://joshzcold.github.io/riptide/guide/installing.html) for the sandbox setup.
          - **Windows:** an experimental installer (`-setup.exe`) or `.zip`; the build starts but is untested by hand.
          - **macOS:** a `.dmg`, `-aarch64` for Apple silicon (supported) or `-x86_64` for Intel (experimental, untested by hand); drag riptide onto Applications. It isn't notarized, so the first start needs **System Settings → Privacy & Security → Open Anyway**.
          - Check a download with `sha256sum -c SHA256SUMS --ignore-missing`, or its build provenance with `gh attestation verify <file> --repo joshzcold/riptide`.
          EOF
      - name: Build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ $VERSION == *-* ]] && flags+=(--prerelease)
          # Creates the tag on the merged release commit.
          gh release create "v$VERSION" --target "$REF" --title "riptide v$VERSION" \
            --notes-file notes.md "${flags[@]}" dist/*
      # The AUR and Nix packages download the release tarball, so a pull
      # request points them at the new version. A dry run shows the change.
      - name: Update the AUR and Nix packages
        if: ${{ !contains(needs.plan.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $PUBLISH == true ]]; then
            git fetch -q origin main
            git checkout -q -B "release/v$VERSION-packages" origin/main
          fi
          scripts/update-packages.sh "$VERSION" "dist/riptide-$VERSION-linux-x86_64.tar.gz"
          git diff -- packaging
          if [[ $PUBLISH != true ]] || git diff --quiet -- packaging; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(release): update the AUR and Nix packages for v$VERSION" -- packaging
          git push -q origin "HEAD:refs/heads/release/v$VERSION-packages"
          scripts/open-pr.sh "release/v$VERSION-packages" \
            "chore(release): update the AUR and Nix packages for v$VERSION" \
            "Points the AUR packages in \`packaging/aur/\` and \`packaging/nix/package.nix\` (and so the flake) at v$VERSION."
      # As the riptide GitHub App, which bypasses main's review rule and whose
      # push starts aur.yml (a push with GITHUB_TOKEN wouldn't).
      - uses: actions/create-github-app-token@v2
        if: env.PUBLISH == 'true' && !contains(needs.plan.outputs.version, '-')
        id: app
        with:
          app-id: ${{ secrets.CEF_UPDATE_APP_ID }}
          private-key: ${{ secrets.CEF_UPDATE_APP_KEY }}
      - name: Merge the packages pull request
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch=release/v$VERSION-packages
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -z $pr ]]; then
            echo "no packages pull request to merge"
            exit 0
          fi
          other=$(gh pr diff "$pr" --name-only | grep -v '^packaging/' || true)
          if [[ -n $other ]]; then
            echo "::error::#$pr changes more than packaging/: $other"
            exit 1
          fi
          # The AUR and Nix checksums must be the released tarball's.
          sum=$(awk -v f="riptide-$VERSION-linux-x86_64.tar.gz" '$2 == f { print $1 }' dist/SHA256SUMS)
          sri="sha256-$(xxd -r -p <<<"$sum" | base64 -w0)"
          diff=$(gh pr diff "$pr")
          if [[ -z $sum ]] || ! grep -Fq "+sha256sums=('$sum')" <<<"$diff" || ! grep -Fq "\"$sri\"" <<<"$diff"; then
            echo "::error::#$pr doesn't point at the released tarball ($sum); merge it by hand after checking"
            exit 1
          fi
          gh pr merge "$pr" --merge --admin --match-head-commit "$(git rev-parse HEAD)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          echo "Merged #$pr, which publishes the AUR packages." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/create-github-app-token@v2
        if: env.PUBLISH == 'true' && !contains(needs.plan.outputs.version, '-')
        id: tap
        continue-on-error: true
        with:
          app-id: ${{ secrets.CEF_UPDATE_APP_ID }}
          private-key: ${{ secrets.CEF_UPDATE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-riptide
      - name: Update the Homebrew cask
        if: steps.tap.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.tap.outputs.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY_OWNER/homebrew-riptide/dispatches" -f event_type=release
          echo "Asked joshzcold/homebrew-riptide to update the cask." >> "$GITHUB_STEP_SUMMARY"
      - name: Notify
        if: env.PUBLISH == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
        run: |
          scripts/notify.sh "riptide v$VERSION is released" \
            "The release is published, the AUR and Nix packages pull request is merged and the Homebrew cask is updating (pre-releases have none)." \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" tada
      - name: Keep the files (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            dist/
            notes.md
          retention-days: 1
