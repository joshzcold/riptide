name: release

# Actions → release → Run workflow cuts a release from main in one go:
#   1. the version: the one you type, or git-cliff's next version from the
#      Conventional Commits since the last tag (feat bumps the minor version in 0.x)
#   2. a `chore(release): vX.Y.Z` commit with Cargo.toml and CHANGELOG.md, tagged vX.Y.Z
#   3. build-release.yml: the Linux tarball and AppImage (smoke-tested), plus
#      experimental macOS and Windows packages
#   4. a GitHub release with SHA256SUMS, build provenance and the changelog section
# "Dry run" (the default) does everything except pushing and publishing, and keeps
# the files as a workflow artifact for a day. Pushing a v* tag by hand still works.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2.0 (empty = work it out from the commits)
        type: string
        required: false
      dry_run:
        description: Dry run (build only, don't push or publish)
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Version, commit and tag
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          current=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)

          if [[ $GITHUB_EVENT_NAME == push ]]; then
            # A tag pushed by hand: it must already match Cargo.toml.
            if [[ "v$current" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match version $current in Cargo.toml"
              exit 1
            fi
            { echo "version=$current"; echo "ref=$GITHUB_REF_NAME"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ $DRY_RUN != true && $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::releases are cut from main; this run is on $GITHUB_REF_NAME (a dry run works anywhere)"
            exit 1
          fi

          version=${INPUT_VERSION#v}
          if [[ -z $version ]]; then
            version=$(scripts/git-cliff.sh --bumped-version 2>/dev/null)
            version=${version#v}
          fi
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' isn't a version like 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
          echo "Releasing v$version (Cargo.toml has $current)"

          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          cargo update --workspace --quiet
          scripts/git-cliff.sh --tag "v$version" -o CHANGELOG.md 2>/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore(release): v$version"
          git tag -a "v$version" -m "riptide v$version"
          git show --stat HEAD

          if [[ $DRY_RUN == true ]]; then
            # Nothing is pushed, so the build uses the branch as it was, with the new version in the file names.
            { echo "version=$version"; echo "ref=$(git rev-parse HEAD~1)"; echo "publish=false"; } >> "$GITHUB_OUTPUT"
          else
            # Atomic, so a main that moved on leaves neither the commit nor the tag behind.
            git push --atomic origin HEAD:main "refs/tags/v$version"
            { echo "version=$version"; echo "ref=v$version"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          # A dry run has no tag yet, so it renders the unreleased commits as if tagged.
          if [[ $PUBLISH == true ]]; then
            scripts/git-cliff.sh --latest --strip header 2>/dev/null > notes.md
          else
            scripts/git-cliff.sh --unreleased --tag "v$VERSION" --strip header 2>/dev/null > notes.md
          fi
          cat >> notes.md <<'EOF'

          ### Downloads

          - **Linux (x86_64):** the `.tar.gz` (unpack and run `riptide`) or the `.AppImage`. See [Installing](https://joshzcold.github.io/riptide/guide/installing.html) for the sandbox setup.
          - **macOS and Windows:** experimental packages that don't run the browser yet.
          - Check a download with `sha256sum -c SHA256SUMS --ignore-missing`, or its build provenance with `gh attestation verify <file> --repo joshzcold/riptide`.
          EOF
      - name: Build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zip
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ $VERSION == *-* ]] && flags+=(--prerelease)
          gh release create "v$VERSION" --verify-tag --title "riptide v$VERSION" --notes-file notes.md "${flags[@]}" dist/*
      - name: Keep the files (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/
            notes.md
          retention-days: 1
