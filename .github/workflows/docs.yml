name: docs

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the book
        run: scripts/mdbook.sh build docs/book
      - name: Check external links
        if: github.event_name == 'schedule'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --include-fragments --no-progress --exclude-path '404\.html$' 'docs/book/book/**/*.html'
          fail: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule'
        with:
          path: docs/book/book

  deploy:
    name: deploy
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
