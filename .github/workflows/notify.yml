name: notify

# Sends a push notification (scripts/notify.sh) when a release or CEF workflow
# fails, or when the checks on a CEF upgrade do, since those need a person.
# Running it by hand sends a test notification.
on:
  workflow_run:
    workflows: [release, aur, cef update, cef automerge, check, audit]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure:
    name: tell about a failure
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      (!contains(fromJSON('["check", "audit"]'), github.event.workflow_run.name) ||
       startsWith(github.event.workflow_run.head_branch, 'deps/cef-'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
          NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          scripts/notify.sh "riptide: $NAME failed" "The $NAME workflow failed on $BRANCH." "$URL" rotating_light

  test:
    name: send a test notification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
        run: |
          scripts/notify.sh "riptide notifications work" "Release and CEF news from GitHub Actions will arrive here." \
            "https://github.com/$GITHUB_REPOSITORY/actions/workflows/notify.yml" bell
