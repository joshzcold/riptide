name: nightly

# Every night that main changed, rebuild it and replace the rolling `nightly`
# pre-release with the new packages. Running it by hand builds even if
# nothing changed.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Anything new since the last nightly?
        id: plan
        run: |
          sha=$(git rev-parse HEAD)
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          build=true
          if [[ $GITHUB_EVENT_NAME == schedule && $sha == "$last" ]]; then
            echo "main is still at the last nightly ($sha)"
            build=false
          fi
          { echo "build=$build"; echo "sha=$sha"; echo "version=nightly-$(date -u +%Y%m%d)-${sha:0:7}"; } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          {
            echo "Built from \`main\` at $SHA on $(date -u +'%Y-%m-%d'). Not a release: it's replaced every night that \`main\` changes, and may be broken."
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`, or its build provenance with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            scripts/git-cliff.sh --unreleased --strip all 2>/dev/null | sed 's/^## Unreleased$/## Changes since the last release/'
          } > notes.md
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zip
      - name: Replace the nightly pre-release
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly --prerelease --latest=false --target "$SHA" \
            --title "Nightly $VERSION" --notes-file notes.md dist/*
