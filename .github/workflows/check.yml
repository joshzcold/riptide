name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Every push to main gets its own complete run (the README badge shows the
  # latest); a pull request only needs its newest commit tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push has no usable base; check just the tip.
          if [[ $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$HEAD~1..$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          scripts/check-commits.sh "$range"

  linux:
    name: linux (lint, tests, smoke, e2e)
    runs-on: ubuntu-24.04
    env:
      CEF_PATH: ${{ github.workspace }}/../cef
    steps:
      - uses: actions/checkout@v4
      - name: Install CEF runtime libraries, Xvfb, xdotool and x11-utils (xprop, xwininfo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-utils libnss3 libgbm1 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libpango-1.0-0 libcairo2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libxi6 libdrm2 libdbus-1-3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-linux-${{ hashFiles('Cargo.lock') }}
      - run: ./task setup
      - run: ./task lint
      - run: ./task test
      # Ubuntu 24.04 blocks unprivileged user namespaces, which the sandbox needs.
      - name: Allow user namespaces for the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ./task smoke
        env:
          EXPECT_SANDBOX: "1"
      - run: ./task e2e

  build:
    name: ${{ matrix.os }} (build, unit tests)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cef-dll-sys downloads CEF into its build directory, which this caches.
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Unit tests
        run: cargo test --locked --no-fail-fast -p rt-core -p rt-config -p rt-storage -p rt-adblock
      - name: Run without CEF (--version, --paths)
        shell: bash
        run: |
          bin=target/debug/riptide
          [[ -f $bin.exe ]] && bin=$bin.exe
          "$bin" --version
          "$bin" --paths

  docs:
    name: docs (build, internal links)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the book
        run: scripts/mdbook.sh build docs/book
      # Offline: only links inside the book; docs.yml checks external ones weekly.
      # 404.html links to the site root (/riptide/), which only exists once deployed.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --exclude-path '404\.html$' 'docs/book/book/**/*.html'
          fail: true
