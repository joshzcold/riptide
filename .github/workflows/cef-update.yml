name: cef update

# Every day, compare the pinned `cef` crate (Cargo.lock) with the newest
# release on crates.io, and open a pull request that upgrades to it;
# cef-automerge.yml merges it once its checks pass. It acts as the riptide
# GitHub App (secrets CEF_UPDATE_APP_ID and CEF_UPDATE_APP_KEY), since a pull
# request opened with GITHUB_TOKEN wouldn't start check.yml.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: upgrade to a new CEF
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      # cef-rs publishes a crate some time after each CEF build, and Chromium's
      # security fixes come in those builds, so an issue says when it lags.
      - name: Open an issue when CEF has a build the newest crate doesn't bind
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
        run: |
          latest=$(curl -fsSL -H 'User-Agent: riptide-cef-update (github.com/joshzcold/riptide)' \
            https://crates.io/api/v1/crates/cef | jq -r '.crate.max_stable_version')
          bound=${latest#*+}
          upstream=$(curl -fsSL https://cef-builds.spotifycdn.com/index.json |
            jq -r '.linux64.versions[] | select(.channel == "stable") | .cef_version' | sort -V | tail -1)
          build=${upstream%%+*}
          chromium=${upstream##*+chromium-}
          echo "the cef crate binds $bound, CEF's newest stable build is $build"
          if [[ -z $build || $latest == null || $build == "$bound" ||
                $(printf '%s\n' "$build" "$bound" | sort -V | tail -1) != "$build" ]]; then
            exit 0
          fi
          title="CEF $build (Chromium $chromium) is out, but the cef crate binds $bound"
          if [[ -n $(gh issue list --state all --search "\"CEF $build\" in:title" --json number --jq '.[0].number // empty') ]]; then
            echo "an issue for CEF $build exists already"
            exit 0
          fi
          issue="$(gh issue create --title "$title" --body "$(cat <<EOF
          CEF's newest stable build is $upstream, and the newest \`cef\` crate on crates.io is $latest. riptide can't use the new build until cef-rs publishes a crate for it: https://github.com/tauri-apps/cef-rs/releases

          If it carries a Chromium security fix (https://chromereleases.googleblog.com), consider asking cef-rs for a release. The daily \`cef-update\` workflow opens the upgrade pull request once the crate is out.
          EOF
          )")"
          scripts/notify.sh "CEF $build is out, but the cef crate lags" "$title" "$issue" warning
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.CEF_UPDATE_APP_ID }}
          private-key: ${{ secrets.CEF_UPDATE_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Open a pull request for the newest cef crate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
        run: |
          pinned=$(awk '/^name = "cef"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          latest=$(curl -fsSL -H 'User-Agent: riptide-cef-update (github.com/joshzcold/riptide)' \
            https://crates.io/api/v1/crates/cef | jq -r '.crate.max_stable_version')
          echo "pinned $pinned, latest $latest"
          if [[ -z $latest || $latest == null || $latest == "$pinned" ]]; then
            exit 0
          fi
          branch="deps/cef-${latest//+/-}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch exists already"
            exit 0
          fi

          # 154.5.0+154.0.34: the crate's version, then the CEF build it binds.
          crate=${latest%%+*}
          build=${latest#*+}
          chromium=$(curl -fsSL https://cef-builds.spotifycdn.com/index.json |
            jq -r --arg build "$build+" '[.linux64.versions[] | select(.cef_version | startswith($build)) | .chromium_version] | first // empty') || true
          sed -i -E "s/^(cef = \{ version = \"=)[^\"]+/\1$crate/" Cargo.toml
          cargo update -p cef -p cef-dll-sys
          now=$(awk '/^name = "cef"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          if [[ $now != "$latest" ]]; then
            echo "::error::Cargo.lock has cef $now after the update, not $latest"
            exit 1
          fi

          # The Nix source package pins the CEF archive too: its full version,
          # SHA-1 (from the index) and SHA-256 (as an SRI hash).
          read -r cef_full sha1 < <(curl -fsSL https://cef-builds.spotifycdn.com/index.json |
            jq -r --arg build "$build+" '[.linux64.versions[] | select(.cef_version | startswith($build))] | first
              | "\(.cef_version) \([.files[] | select(.type == "minimal") | .sha1] | first)"')
          archive="cef_binary_${cef_full}_linux64_minimal.tar.bz2"
          curl -fsSL -o "$RUNNER_TEMP/cef.tar.bz2" "https://cef-builds.spotifycdn.com/$archive"
          echo "$sha1  $RUNNER_TEMP/cef.tar.bz2" | sha1sum -c -
          sri="sha256-$(sha256sum "$RUNNER_TEMP/cef.tar.bz2" | cut -d' ' -f1 | xxd -r -p | base64 -w0)"
          rev=${cef_full#*+g}
          rev=${rev%%+*}
          sed -i -E \
            -e "s/^(  cefVersion = \")[^\"]*/\1$build/" \
            -e "s/^(  cefGitRevision = \")[^\"]*/\1$rev/" \
            -e "s/^(  cefChromiumVersion = \")[^\"]*/\1${cef_full##*+chromium-}/" \
            -e "s/^(  cefSha1 = \")[^\"]*/\1$sha1/" \
            -e "s|^(      srcHashes.x86_64-linux = \")[^\"]*|\1$sri|" \
            packaging/nix/source.nix
          git diff --stat -- packaging/nix/source.nix

          subject="feat: update CEF to $build${chromium:+ (Chromium $chromium)}"
          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "/users/$bot" --jq .id)+$bot@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "$subject"
          git push -q origin "$branch"

          # Closes the issue the step above opened while the crate lagged.
          issue=$(gh issue list --state open --search "\"CEF $build\" in:title" --json number --jq '.[0].number // empty')
          pr=$(gh pr create --base main --head "$branch" --title "$subject" --body "$(cat <<EOF
          The \`cef\` crate $latest is out (riptide pins $pinned): https://github.com/tauri-apps/cef-rs/releases

          This bumps \`Cargo.toml\`, \`Cargo.lock\` and the CEF build in \`packaging/nix/source.nix\`. The check below runs the lint, unit, e2e and smoke tests against the new CEF. If the generated bindings changed, push the fixes to this branch.
          ${issue:+
          Closes #$issue}

          Opened by the daily \`cef-update\` workflow, and merged by \`cef-automerge\` once its checks pass.
          EOF
          )")

          # An older upgrade that never merged is out of date now.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"deps/cef-\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Superseded by $pr."
            done
          scripts/notify.sh "CEF $build is up for merging" "$subject. cef-automerge merges it once its checks pass." "$pr" arrow_up
