[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
# Not on crates.io; also lets cargo-deny accept the path dependencies between crates.
publish = false
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/joshzcold/riptide"

[workspace.dependencies]
rt-adblock = { path = "crates/rt-adblock" }
rt-core = { path = "crates/rt-core" }
rt-cef = { path = "crates/rt-cef" }
rt-config = { path = "crates/rt-config" }
rt-storage = { path = "crates/rt-storage" }
cef = { version = "=154.4.0", default-features = false }
# Without "single-thread" the engine is Send + Sync, for CEF's IO thread.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
arboard = { version = "3.6", default-features = false }
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
