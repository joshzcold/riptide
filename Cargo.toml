[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/joshzcold/hackers-browser"

[workspace.dependencies]
hb-core = { path = "crates/hb-core" }
hb-cef = { path = "crates/hb-cef" }
cef = { version = "=154.3.0", default-features = false }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
