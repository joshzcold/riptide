# cargo-deny: run with `scripts/tool.sh cargo-deny check` (part of `./task lint`).
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# RustSec advisories; yanked crates fail too. Ignoring one needs a reason here.
yanked = "deny"
ignore = []

[licenses]
# riptide is GPL-3.0-or-later and ships its dependencies, so every license
# here must be GPL-3.0-compatible. A new one needs checking before it's added.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.93

[bans]
# Duplicate versions are common in large graphs; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own (unpublished) crates have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
