# git-cliff configuration: CHANGELOG.md from Conventional Commits.
# Regenerate with `./task changelog`.

[changelog]
header = """
# Changelog

All notable changes to riptide. Generated by [git-cliff](https://git-cliff.org) \
from [Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = false
footer = ""
# Without `trim`, squeeze the blank lines the template leaves.
postprocessors = [
    { pattern = "\n{3,}", replace = "\n\n" },
    { pattern = "\n+$", replace = "\n" },
]

[git]
conventional_commits = true
# The first commits predate Conventional Commits; the parsers below sort them.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^revert", group = "<!-- 3 -->Reverted" },
    { message = "^(docs|test|ci|chore|style|refactor|build)", skip = true },
    { message = "^(Add|Scaffold) ", group = "<!-- 0 -->Features" },
    { message = ".*", skip = true },
]

[bump]
# The first release; later ones bump from the last tag (0.x: features bump the minor version).
initial_tag = "v0.1.0"
