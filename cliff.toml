# git-cliff configuration: CHANGELOG.md from Conventional Commits.
# Regenerate with `./task changelog`.

[changelog]
header = """
# Changelog

All notable changes to riptide. Generated by [git-cliff](https://git-cliff.org) \
from [Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = false
footer = ""
# Without `trim`, squeeze the blank lines the template leaves.
postprocessors = [
    { pattern = "\n{3,}", replace = "\n\n" },
    { pattern = "\n+$", replace = "\n" },
]

[git]
conventional_commits = true
# The first commits predate Conventional Commits; the parsers below sort them.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# A word like lua:<name> would be an unclosed HTML tag in the book, and upper_first would turn sH into SH.
# As code they read the same there and on riptide's :changelog page.
commit_preprocessors = [
    { pattern = '([^\s`]*<[\w-]+>[^\s`]*)', replace = "`${1}`" },
    { pattern = '\bsH sJ sK sL\b', replace = "`sH` `sJ` `sK` `sL`" },
]
commit_parsers = [
    # Left out by hand: a feature reverted before it shipped, and a fix that landed twice.
    { sha = "4b5e4583a634d70673b8f620b55e05be4c715caf", skip = true },
    { sha = "4bde788f96001d11d8a717ee5b44dac44ae413c3", skip = true },
    { sha = "2c8282f71c547efc53ff03a7112935cebf6367fb", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^revert", group = "<!-- 3 -->Reverted" },
    { message = "^(docs|test|ci|chore|style|refactor|build)", skip = true },
    { message = "^(Add|Scaffold) ", group = "<!-- 0 -->Features" },
    { message = ".*", skip = true },
]

[bump]
# The first release; later ones bump from the last tag (0.x: features bump the minor version).
initial_tag = "v0.1.0"
# In 0.x a breaking change bumps the minor version too; 1.0 is a deliberate choice.
breaking_always_bump_major = false
